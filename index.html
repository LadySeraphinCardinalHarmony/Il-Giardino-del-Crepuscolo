<script>
"use strict";
/* ==========================================================================
   Modello locale (Qwen tramite WebLLM). Gira nel browser, sulla scheda video:
   nessun dato esce dal dispositivo, nessuna chiave, nessun costo.
   Serve a leggere un PDF che possiedi e ricavarne voci di compendio.
   ========================================================================== */
var IA={engine:null,modello:'Qwen2.5-1.5B-Instruct-q4f16_1-MLC',stato:'spento',prog:''};
var MODELLI=[
 ['Qwen2.5-1.5B-Instruct-q4f16_1-MLC','Qwen 1.5B','circa 1,1 GB · veloce, impreciso'],
 ['Qwen2.5-3B-Instruct-q4f16_1-MLC','Qwen 3B','circa 2,0 GB · equilibrato'],
 ['Qwen2.5-7B-Instruct-q4f16_1-MLC','Qwen 7B','circa 4,4 GB · lento, migliore']
];
function iaDisponibile(){ return typeof navigator!=='undefined' && !!navigator.gpu }
function iaCarica(onProg){
  if(IA.engine) return Promise.resolve(IA.engine);
  if(!iaDisponibile()) return Promise.reject(new Error(
    'Questo browser non espone WebGPU, che serve per far girare il modello. '+
    'Su computer usa Chrome o Edge aggiornati; su iPad serve Safari 18 o successivo.'));
  IA.stato='caricamento';
  return import('https://esm.run/@mlc-ai/web-llm').then(function(webllm){
    return webllm.CreateMLCEngine(IA.modello,{initProgressCallback:function(p){
      IA.prog=p.text||''; if(onProg) onProg(p.text||'', p.progress||0);
    }});
  }).then(function(e){ IA.engine=e; IA.stato='pronto'; return e });
}
function iaChiedi(sistema,utente,maxTok){
  return IA.engine.chat.completions.create({
    messages:[{role:'system',content:sistema},{role:'user',content:utente}],
    temperature:0.1, max_tokens:maxTok||900
  }).then(function(r){ return r.choices[0].message.content });
}
function jsonDaTesto(t){
  var s=String(t).replace(/```json|```/g,'').trim();
  var a=s.indexOf('['), b=s.lastIndexOf(']');
  if(a<0){ a=s.indexOf('{'); b=s.lastIndexOf('}') }
  if(a<0) throw new Error('Il modello non ha risposto in JSON.');
  return JSON.parse(s.slice(a,b+1));
}
/* voci ricavate dai tuoi PDF: restano nella tua cartella, divise per gioco */
function caricaCompUser(){
  return DB.list('compendio').then(function(ps){
    return Promise.all(ps.map(function(p){return DB.readJSON(p)}));
  }).then(function(all){
    S.compUser={};
    all.filter(Boolean).forEach(function(f){ S.compUser[f.sys]=f.voci||[] });
  }).catch(function(){ S.compUser={} });
}
function salvaCompUser(sys){
  return DB.writeJSON('compendio/'+sys+'.json',{sys:sys,voci:S.compUser[sys]||[],agg:nowISO()});
}
ACT.iaPannello=function(){
  var ok=iaDisponibile();
  modal('<h2 style="font-size:19px">Modello locale</h2>'+
    '<p class="faint" style="margin:9px 0;line-height:1.6">Scarica un modello Qwen una volta sola e '+
    'gira sulla scheda video del dispositivo. Nessun dato esce da qui, nessuna chiave, nessun costo.</p>'+
    (ok?'':'<p class="faint" style="margin:0 0 12px;color:#C2506A;line-height:1.6">'+
      'Questo browser non espone WebGPU. Su computer serve Chrome o Edge aggiornati, '+
      'su iPad Safari 18 o successivo. Senza, il resto dell\u2019app funziona lo stesso.</p>')+
    '<label style="display:block;margin-bottom:11px"><span class="lab">Modello</span><select id="mm">'+
    MODELLI.map(function(m){return '<option value="'+m[0]+'"'+(IA.modello===m[0]?' selected':'')+'>'+
      m[1]+' — '+m[2]+'</option>'}).join('')+'</select></label>'+
    '<div id="ip" class="faint" style="margin-bottom:11px">'+
    (IA.stato==='pronto'?'Modello pronto.':'Non ancora caricato.')+'</div>'+
    '<div class="row" style="gap:7px"><button class="mbtn metal grow" id="ic"'+(ok?'':' disabled')+'>'+
    '<span>Carica il modello</span></button>'+
    '<button class="btn grow" id="ix">Leggi un PDF</button></div>'+
    '<p class="faint" style="margin:12px 0 0;line-height:1.6">Aspettative oneste: un modello da 1,5 miliardi '+
    'di parametri sbaglia spesso i dettagli. Serve a preparare una bozza da correggere, non a fidarsi a occhi chiusi. '+
    'Su iPad la memoria disponibile è poca: se si blocca, usa il computer.</p>'+
    '<button class="btn" style="width:100%;margin-top:12px" data-close>Chiudi</button>',
  function(el,close){
    $('#mm',el).onchange=function(){ IA.modello=this.value; IA.engine=null; IA.stato='spento';
      $('#ip',el).textContent='Modello cambiato: va ricaricato.' };
    $('#ic',el).onclick=function(){
      $('#ip',el).innerHTML='<span class="busy"></span> avvio…';
      iaCarica(function(t,p){ $('#ip',el).innerHTML='<span class="busy"></span> '+esc(t) })
      .then(function(){ $('#ip',el).textContent='Modello pronto.' })
      .catch(function(e){ $('#ip',el).textContent=e.message });
    };
    $('#ix',el).onclick=function(){ close(); iaLeggiPDF() };
  });
};
function iaLeggiPDF(){
  if(!IA.engine) return toast('Carica prima il modello');
  pickFile('application/pdf').then(function(fs){
    if(!fs[0]) return;
    var sys=(S.pg&&S.pg.sys)||'dnd24';
    var m=modal('<h2 style="font-size:19px">Leggo il manuale</h2>'+
      '<label style="display:block;margin:11px 0"><span class="lab">Aggiungi al compendio di</span>'+
      '<select id="sy">'+Object.keys(SISTEMI).map(function(k){
        return '<option value="'+k+'"'+(k===sys?' selected':'')+'>'+SISTEMI[k].n+'</option>'}).join('')+'</select></label>'+
      '<label style="display:block;margin-bottom:11px"><span class="lab">Pagine (per esempio 120-140)</span>'+
      '<input id="pp" placeholder="lascia vuoto per tutte"></label>'+
      '<div id="st" class="faint" style="margin-bottom:11px">Pronto.</div>'+
      '<div id="ris" style="max-height:40vh;overflow-y:auto"></div>'+
      '<div class="row" style="margin-top:12px"><button class="btn grow" data-close>Chiudi</button>'+
      '<button class="mbtn metal grow" id="go"><span>Estrai</span></button></div>',
    function(el,close){
      $('#go',el).onclick=function(){
        var target=$('#sy',el).value, range=$('#pp',el).value.trim();
        var trovate=[];
        $('#st',el).innerHTML='<span class="busy"></span> apro il PDF…';
        loadPdfJs().then(function(){ return fs[0].arrayBuffer() })
        .then(function(buf){ return window.pdfjsLib.getDocument({data:buf}).promise })
        .then(function(pdf){
          var da=1, a=pdf.numPages;
          var mm=range.match(/(\d+)\s*-\s*(\d+)/);
          if(mm){ da=clamp(+mm[1],1,pdf.numPages); a=clamp(+mm[2],da,pdf.numPages) }
          a=Math.min(a,da+39);
          var testi=[], p=da;
          function pagina(){
            if(p>a) return Promise.resolve();
            $('#st',el).innerHTML='<span class="busy"></span> pagina '+p+' di '+a;
            return pdf.getPage(p).then(function(pg2){ return pg2.getTextContent() })
              .then(function(tc){
                testi.push(tc.items.map(function(i){return i.str}).join(' ').replace(/\s+/g,' '));
                p++; return pagina();
              });
          }
          return pagina().then(function(){ return testi.join('\n') });
        })
        .then(function(testo){
          var pezzi=[];
          for(var i=0;i<testo.length;i+=3000) pezzi.push(testo.slice(i,i+3000));
          pezzi=pezzi.slice(0,12);
          var idx=0;
          function passo(){
            if(idx>=pezzi.length) return Promise.resolve();
            $('#st',el).innerHTML='<span class="busy"></span> il modello legge il blocco '+(idx+1)+' di '+pezzi.length;
            return iaChiedi(
              'Sei un assistente che struttura regole di giochi di ruolo. Rispondi SOLO con un array JSON, '+
              'senza testo intorno. Ogni elemento: {"nome":"","tipo":"incantesimo|abilita|regola|oggetto",'+
              '"liv":numero o null,"testo":"riassunto in italiano di due frasi"}. '+
              'Se il brano non contiene voci riconoscibili rispondi [].',
              'Estrai le voci da questo brano di manuale:\n\n'+pezzi[idx], 900)
            .then(function(r){
              try{
                var arr=jsonDaTesto(r);
                if(Array.isArray(arr)) arr.forEach(function(x){
                  if(x&&x.nome&&x.testo) trovate.push(x) });
              }catch(e){}
              idx++;
              $('#ris',el).innerHTML=trovate.map(function(x,i){
                return '<div class="line"><span class="grow">'+esc(x.nome)+'</span>'+
                  '<span class="pill">'+esc(x.tipo||'regola')+'</span>'+
                  '<button class="btn sm danger" data-scarta="'+i+'">✕</button></div>'}).join('');
              return passo();
            });
          }
          return passo();
        })
        .then(function(){
          if(!trovate.length){ $('#st',el).textContent='Non ho trovato voci riconoscibili.'; return }
          S.compUser=S.compUser||{};
          S.compUser[target]=(S.compUser[target]||[]).concat(trovate);
          return salvaCompUser(target).then(function(){
            $('#st',el).textContent=trovate.length+' voci aggiunte al compendio di '+SISTEMI[target].n+
              '. Rileggile: il modello sbaglia.';
            render();
          });
        })
        .catch(function(e){ $('#st',el).textContent='Non ci sono riuscito: '+e.message });
      };
      el.addEventListener('click',function(ev){
        var b=ev.target.closest('[data-scarta]'); if(!b) return;
      });
    });
  });
}

</script>
<script>
"use strict";
/* ==========================================================================
   Sistemi costruiti da te: uno schema descrive sezioni e campi, e l'app
   disegna la scheda. Gli schemi si generano anche dal PDF di una scheda.
   ========================================================================== */
function caricaSchemiUser(){
  return DB.list('schemi').then(function(ps){
    return Promise.all(ps.map(function(p){return DB.readJSON(p)}));
  }).then(function(all){
    S.schemiUser=all.filter(Boolean);
    S.schemiUser.forEach(function(sc){
      SISTEMI[sc.id]={n:sc.name,fam:'custom',schema:sc};
    });
  }).catch(function(){ S.schemiUser=[] });
}
function salvaSchemaUser(sc){
  if(!sc||!sc.id) return Promise.resolve();
  S.schemiUser=(S.schemiUser||[]).filter(function(x){return x.id!==sc.id}).concat([sc]);
  SISTEMI[sc.id]={n:sc.name,fam:'custom',schema:sc};
  return DB.writeJSON('schemi/'+sc.id+'.json',sc);
}
function sheetCustom(pg){
  var sc=(SISTEMI[pg.sys]||{}).schema;
  if(!sc) return slab('<p class="faint">Lo schema di questa scheda non è più disponibile.</p>');
  var v=pg.values;
  return (sc.sections||[]).map(function(s){
    var campi=(s.fields||[]).map(function(f){ return campoCustom(f,v) }).join('');

      : '<div class="grid '+(s.layout==='g3'?'g3':'g2')+'">'+campi+'</div>';
    return slab(sec(s.title||'Sezione',inner));
  }).join('');
}
function campoCustom(f,v){

        (m>=0?'+':'')+m+'</button></div>';
    }
    case 'tracker':{
      var t=val||{cur:0,max:0};
      return '<div class="fld trk"><div class="lab">'+esc(f.label)+'</div>'+
        '<div class="row" style="gap:6px"><input type="number" inputmode="numeric" data-trc="'+esc(f.id)+'" value="'+(t.cur||0)+
        '" style="text-align:center;font-family:var(--mono);font-weight:700"><span class="faint">/</span>'+
        '<input type="number" inputmode="numeric" data-trm="'+esc(f.id)+'" value="'+(t.max||0)+
        '" style="width:70px;text-align:center;font-family:var(--mono)"></div></div>';
    }
    case 'check':
      return '<label class="fld row" style="gap:9px"><input type="checkbox" data-v="'+esc(f.id)+'"'+
        (val?' checked':'')+' style="width:20px;height:20px;flex:none"><span class="grow">'+esc(f.label)+'</span></label>';
    case 'longtext':
      return '<div class="fld"><span class="lab">'+esc(f.label)+'</span>'+
        '<textarea data-v="'+esc(f.id)+'" rows="4">'+esc(val||'')+'</textarea></div>';
    case 'number':
      return '<div class="fld"><span class="lab">'+esc(f.label)+'</span>'+
        '<input type="number" inputmode="numeric" data-v="'+esc(f.id)+'" value="'+(val==null?0:val)+'"></div>';
    case 'lista':
      return '<div class="fld"><div class="lab">'+esc(f.label)+'</div>'+
        listaEditabile(f.id,val||[],[['n','Voce'],['t','Nota']],null)+'</div>';
    case 'dadi':
      return '<div class="line"><button class="v" data-roll="'+esc(f.dado||'1d6')+'" data-rl="'+esc(f.label)+'">'+
        esc(f.dado||'1d6')+'</button><span class="grow">'+esc(f.label)+'</span></div>';
    default:
      return '<div class="fld"><span class="lab">'+esc(f.label)+'</span>'+
        '<input data-v="'+esc(f.id)+'" value="'+esc(val==null?'':val)+'"></div>';
  }
}
/* ------------------- generazione dello schema da una scheda ------------- */
ACT.generaScheda=function(){
  if(!modoStudio()) return toast('Funzione da computer');
  if(!IA.engine) { toast('Carica prima il modello'); return ACT.iaPannello() }
  pickFile('application/pdf,image/*').then(function(fs){
    if(!fs[0]) return;
    var f=fs[0];
    var m=modal('<h2 style="font-size:19px">Ricostruisco la scheda</h2>'+
      '<label style="display:block;margin:11px 0"><span class="lab">Nome del gioco</span>'+
      '<input id="gn" placeholder="Per esempio Brancalonia"></label>'+
      '<div id="gs" class="faint" style="margin-bottom:10px">Pronto.</div>'+
      '<pre id="gp" style="max-height:34vh;overflow:auto;font-family:var(--mono);font-size:11px;'+
      'white-space:pre-wrap;color:var(--ink-dim)"></pre>'+
      '<div class="row" style="margin-top:12px"><button class="btn grow" data-close>Chiudi</button>'+
      '<button class="mbtn metal grow" id="gg"><span>Genera</span></button></div>',
    function(el,close){
      $('#gg',el).onclick=function(){
        var nome=$('#gn',el).value.trim()||'Gioco senza nome';
        $('#gs',el).innerHTML='<span class="busy"></span> leggo il documento…';
        var testo='';
        loadPdfJs().then(function(){ return f.arrayBuffer() })
        .then(function(buf){
          if(f.type!=='application/pdf') throw new Error('Per ora leggo solo PDF con testo.');
          return window.pdfjsLib.getDocument({data:buf}).promise;
        }).then(function(pdf){
          var n=Math.min(pdf.numPages,4), p=1;
          function pagina(){
            if(p>n) return Promise.resolve();
            return pdf.getPage(p).then(function(x){ return x.getTextContent() }).then(function(tc){
              testo+=' '+tc.items.map(function(i){return i.str}).join(' ');
              p++; return pagina();
            });
          }
          return pagina();
        }).then(function(){
          $('#gs',el).innerHTML='<span class="busy"></span> il modello ricostruisce i campi…';
          return iaChiedi(
            'Sei un progettista di schede per giochi di ruolo. Rispondi SOLO con JSON valido, senza testo intorno. '+
            'Struttura: {"name":"","sections":[{"title":"","layout":"g2|g3|stack",'+
            '"fields":[{"id":"minuscolo_senza_spazi","label":"","type":"text|number|stat|tracker|check|longtext|lista|dadi"}]}]}. '+
            'Usa stat per caratteristiche con modificatore, tracker per coppie attuale/massimo, '+
            'lista per tabelle, dadi per tiri fissi. Etichette in italiano.',
            'Ricostruisci come scheda digitale questa scheda cartacea:\n\n'+testo.slice(0,5000), 1400);
        }).then(function(r){
          $('#gp',el).textContent=r.slice(0,3000);
          var sc=jsonDaTesto(r);
          sc.id='sys_'+Math.random().toString(36).slice(2,8);
          sc.name=nome; sc.creato=nowISO();
          if(!sc.sections||!sc.sections.length) throw new Error('Nessuna sezione riconosciuta.');
          return salvaSchemaUser(sc).then(function(){
            $('#gs',el).textContent='Fatto: '+sc.sections.length+' sezioni, '+
              sc.sections.reduce(function(n,s){return n+(s.fields||[]).length},0)+' campi. '+
              'Ora compare fra i sistemi quando crei un personaggio.';
            render();
          });
        }).catch(function(e){ $('#gs',el).textContent='Non ci sono riuscito: '+e.message });
      };
    });
  });
};
ACT.schemiUser=function(){
  var l=S.schemiUser||[];
  modal('<h2 style="font-size:19px">Schede costruite da te</h2>'+
    '<div style="margin:11px 0">'+(l.length?l.map(function(sc,i){
      return '<div class="line"><span class="grow">'+esc(sc.name)+
        '<span class="faint" style="font-size:11px"> · '+(sc.sections||[]).length+' sezioni</span></span>'+
        '<button class="btn sm" data-scexp="'+i+'">esporta</button>'+
        '<button class="btn sm danger" data-scdel="'+i+'">✕</button></div>'}).join('')
      :'<p class="faint">Nessuna. Sul computer puoi generarne una dal PDF di una scheda.</p>')+'</div>'+
    (modoStudio()?'<button class="mbtn metal" style="width:100%;margin-bottom:9px" data-act="generaScheda">'+
      '<span>Genera da una scheda in PDF</span></button>':'')+
    '<button class="btn" style="width:100%" data-close>Chiudi</button>',
  function(el,close){
    $$('[data-scexp]',el).forEach(function(b){ b.onclick=function(){
      var sc=l[+b.dataset.scexp];
      download(sc.name.replace(/\W+/g,'_')+'.json',new Blob([JSON.stringify(sc,null,1)],{type:'application/json'}));
    }});
    $$('[data-scdel]',el).forEach(function(b){ b.onclick=function(){
      var sc=l[+b.dataset.scdel]; close();
      ask('Elimina scheda','I personaggi creati con <b>'+esc(sc.name)+'</b> restano ma non si aprono più.','Elimina')
      .then(function(y){ if(!y) return;
        DB.remove('schemi/'+sc.id+'.json').then(function(){
          delete SISTEMI[sc.id];
          S.schemiUser=S.schemiUser.filter(function(x){return x.id!==sc.id});
          render();
        });
      });
    }});
  });
};

</script>
<script>
"use strict";
/* ==========================================================================
   Pacchetti di contenuti: quello che prepari sul computer arriva al tablet,
   copiando un file oppure scaricandolo da un indirizzo.
   ========================================================================== */
function pacchettoCorrente(){
  return {
    tipo:'tavolo-contenuti', versione:1, generato:nowISO(),
    da:PIATT.nome,
    compendio:S.compUser||{},
    sistemi:(S.schemiUser||[]),
    incantesimi:(S.cfg.incantesimiUser||[])
  };
}
function firmaPacchetto(p){
  var n=0;
  Object.keys(p.compendio||{}).forEach(function(k){ n+=(p.compendio[k]||[]).length });
  return n+' voci · '+((p.sistemi||[]).length)+' schede · '+new Date(p.generato).toLocaleString('it-IT');
}
function applicaPacchetto(p){
  if(!p||p.tipo!=='tavolo-contenuti') return Promise.reject(new Error('Non è un pacchetto di Tavolo.'));
  S.compUser=S.compUser||{};
  var jobs=[];
  Object.keys(p.compendio||{}).forEach(function(sys){
    var esistenti={}; (S.compUser[sys]||[]).forEach(function(x){ esistenti[x.nome]=1 });
    var nuove=(p.compendio[sys]||[]).filter(function(x){ return !esistenti[x.nome] });
    S.compUser[sys]=(S.compUser[sys]||[]).concat(nuove);
    jobs.push(salvaCompUser(sys));
  });
  (p.sistemi||[]).forEach(function(sc){ jobs.push(salvaSchemaUser(sc)) });
  S.cfg.ultimoPacchetto={quando:nowISO(),firma:firmaPacchetto(p)};
  jobs.push(saveCfg());
  return Promise.all(jobs).then(function(){
    return caricaCompUser();
  }).then(caricaSchemiUser);
}
ACT.esportaPacchetto=function(){
  var p=pacchettoCorrente();
  download('tavolo-contenuti-'+new Date().toISOString().slice(0,10)+'.json',
    new Blob([JSON.stringify(p,null,1)],{type:'application/json'}));
  toast(firmaPacchetto(p));
};
ACT.importaPacchetto=function(){
  pickFile('application/json').then(function(fs){
    if(!fs[0]) return;
    return fs[0].text().then(function(t){
      var p=JSON.parse(t);
      return ask('Aggiorna i contenuti',firmaPacchetto(p)+
        '<br><br>Le voci che hai già non vengono duplicate.','Aggiorna').then(function(y){
        if(!y) return;
        return applicaPacchetto(p).then(function(){ render(); toast('Contenuti aggiornati') });
      });
    });
  }).catch(function(e){ toast('File non valido') });
};
/* ---------------------- sincronizzazione da un indirizzo ---------------- */
ACT.sincro=function(){
  modal('<h2 style="font-size:19px">Sincronizzazione</h2>'+
    '<p class="faint" style="margin:9px 0;line-height:1.6">Metti il pacchetto in un posto raggiungibile dalla rete '+
    'e incolla qui il suo indirizzo. Il tablet lo controlla all\u2019avvio e ti avvisa se è cambiato.</p>'+
    '<label style="display:block;margin-bottom:11px"><span class="lab">Indirizzo del pacchetto</span>'+
    '<input id="su" value="'+esc(S.cfg.sincroUrl||'')+'" placeholder="https://raw.githubusercontent.com/tuonome/tavolo/main/contenuti.json"></label>'+
    '<label class="row" style="margin-bottom:12px;gap:9px"><input type="checkbox" id="sa" '+
    (S.cfg.sincroAuto?'checked':'')+' style="width:20px;height:20px;flex:none">'+
    '<span class="grow faint" style="font-size:12.5px">Controlla a ogni avvio</span></label>'+
    (S.cfg.ultimoPacchetto?'<p class="faint" style="margin:0 0 12px">Ultimo aggiornamento: '+
      esc(S.cfg.ultimoPacchetto.firma)+'</p>':'')+
    '<div class="row" style="gap:7px"><button class="btn grow" data-close>Chiudi</button>'+
    '<button class="btn grow" id="sv">Salva</button>'+
    '<button class="mbtn metal grow" id="sn"><span>Scarica ora</span></button></div>'+
    '<p class="faint" style="margin:12px 0 0;line-height:1.6">Se usi GitHub: metti <b style="color:var(--ink)">contenuti.json</b> '+
    'nello stesso repository dell\u2019app e usa l\u2019indirizzo <b style="color:var(--ink)">raw.githubusercontent.com</b>. '+
    'Va bene anche un link condiviso di iCloud Drive, Dropbox o Drive, purché scarichi il file diretto.</p>',
  function(el,close){
    $('#sv',el).onclick=function(){
      S.cfg.sincroUrl=$('#su',el).value.trim();
      S.cfg.sincroAuto=$('#sa',el).checked;
      saveCfg(); close(); toast('Impostazione salvata');
    };
    $('#sn',el).onclick=function(){
      S.cfg.sincroUrl=$('#su',el).value.trim();
      S.cfg.sincroAuto=$('#sa',el).checked; saveCfg();
      close(); scaricaPacchetto(true);
    };
  });
};
function scaricaPacchetto(manuale){
  var url=S.cfg.sincroUrl;
  if(!url) return manuale&&toast('Nessun indirizzo impostato');
  var m=manuale?modal('<h2 style="font-size:19px">Scarico</h2>'+
    '<p class="faint" style="margin:9px 0"><span class="busy"></span> controllo l\u2019indirizzo…</p>'):null;
  return fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('il server ha risposto '+r.status);
    return r.json();
  }).then(function(p){
    if(m) m.close();
    if(S.cfg.ultimoPacchetto&&S.cfg.ultimoPacchetto.firma===firmaPacchetto(p)){
      if(manuale) toast('Sei già aggiornato');
      return;
    }
    return ask('Contenuti disponibili',firmaPacchetto(p),'Aggiorna').then(function(y){
      if(!y) return;
      return applicaPacchetto(p).then(function(){ render(); toast('Contenuti aggiornati') });
    });
  }).catch(function(e){
    if(m) m.close();
    if(manuale) modal('<h2 style="font-size:19px">Non ci sono riuscito</h2>'+
      '<p class="faint" style="margin:9px 0 14px;line-height:1.6">'+esc(e.message)+
      '<br><br>Se il file sta su un altro sito, quel sito deve permettere il download da pagine esterne. '+
      'GitHub lo permette, molti servizi di condivisione no: in quel caso copia il file a mano.</p>'+
      '<button class="btn" style="width:100%" data-close>Chiudi</button>');
  });
}

</script>
<script>
"use strict";
/* ============ collegamenti fra le parti aggiunte e il nucleo dell'app ==== */
S.compSez='inc';
S.compUser={};
/* fondo i blocchi di dati caricati separatamente */
if(typeof CLASSI_EXTRA!=='undefined')
  Object.keys(CLASSI_EXTRA).forEach(function(k){ CLASSI[k]=CLASSI_EXTRA[k] });
if(typeof SRD_INC2!=='undefined') SRD_INC=SRD_INC.concat(SRD_INC2);
/* la scheda cartacea si adatta alla larghezza dopo ogni disegno */
(function(){
  var old=render;
  render=function(){ old.apply(null,arguments);
    if(typeof scalaCarta==='function') setTimeout(scalaCarta,16) };
})();
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-opensess],[data-delsess],[data-stato],[data-offstato],[data-cs],'+
    '[data-addinc],[data-addarma],[data-sec]');
  if(!t) return;
  var d=t.dataset;
  if(d.opensess!==undefined){
    var s=null; S.sessioni.forEach(function(x){ if(x.id===d.opensess) s=x });
    if(!s) return;
    if(S.sess&&S.sess.id!==s.id){ S.sess.aperta=false; saveSess() }
    S.sess=s; s.aperta=true; saveSess(); renderFromTop(); return;
  }
  if(d.delsess!==undefined){
    ask('Elimina sessione','Il diario e la cronologia vengono cancellati.','Elimina').then(function(y){
      if(!y) return;
      DB.remove(P.sess(d.delsess)).then(caricaSessioni).then(renderFromTop);
    });
    return;
  }
  if(d.stato!==undefined){
    if(!S.sess) return toast('Apri prima una sessione');
    S.sess.stati=S.sess.stati||{};
    S.sess.stati[d.stato]=!S.sess.stati[d.stato];
    S.sess.log.unshift({t:nowISO(),txt:(S.sess.stati[d.stato]?'Attivo: ':'Spento: ')+d.stato.split(':')[1]});
    saveSess();
    t.style.boxShadow=S.sess.stati[d.stato]?'inset 0 0 0 2px var(--m2)':'';
    t.textContent=S.sess.stati[d.stato]?'●':'○';
    return;
  }
  if(d.offstato!==undefined){
    S.sess.stati[d.offstato]=false; saveSess(); render(); return;
  }
  if(d.cs!==undefined){ S.compSez=d.cs; render(); return }
  if(d.addinc!==undefined){
    var sp=null; SRD_INC.forEach(function(a){ if(a[0]===d.addinc) sp=incObj(a) });
    if(!sp||!S.pg) return;
    S.pg.values.incant=(S.pg.values.incant||[]).concat([sp]);
    savePGSoon(); toast(sp.nome+' aggiunto alla scheda'); return;
  }
  if(d.addarma!==undefined){
    if(!S.pg) return;
    var w=null; SRD_ARMI.forEach(function(a){ if(a[0]===d.addarma) w=a });
    var v=S.pg.values, A=autoDnD(S.pg);
    var acc=/accurata/.test(w[4])||/distanza/.test(w[1]);
    var car=acc?Math.max(modOf(v.forza),modOf(v.des)):modOf(v.forza);
    var b=car+A.comp;
    v.atk=(v.atk||[]).concat([{nome:w[0],bonus:(b>=0?'+':'')+b,danni:w[2]+(car>=0?'+':'')+car}]);
    savePGSoon(); toast(w[0]+' aggiunta alla scheda'); return;
  }
},false);

/* le sezioni ricordano se le hai chiuse */
document.addEventListener('toggle',function(e){
  var s=e.target;
  if(!s.dataset||!s.dataset.sec) return;
  S.secChiuse[s.dataset.sec]=!s.open;
},true);

/* ricerca nel compendio */
document.addEventListener('input',function(e){
  if(e.target.dataset&&e.target.dataset.cq!==undefined){
    var r=document.getElementById('cres');
    if(r) r.innerHTML=compLista(e.target.value);
  }
},false);

/* la sessione carica anche l'elenco all'avvio */
(function(){
  var t=0;
  var iv=setInterval(function(){
    t++;
    if(S.pgs!==undefined&&DB.store){
      clearInterval(iv);
      if(typeof caricaCompUser==='function') caricaCompUser().then(function(){ if(S.tab==='compendio') render() });
      if(typeof caricaSchemiUser==='function') caricaSchemiUser().then(function(){ render() });
      if(S.cfg.sincroAuto&&S.cfg.sincroUrl&&typeof scaricaPacchetto==='function')
        setTimeout(function(){ scaricaPacchetto(false) },1800);
      caricaSessioni().then(function(all){
        var aperte=all.filter(function(x){return x.aperta});
        if(aperte.length) S.sess=aperte[0];
        if(S.tab==='sessione') render();
      });
    }
    if(t>60) clearInterval(iv);
  },120);
})();

</script>
