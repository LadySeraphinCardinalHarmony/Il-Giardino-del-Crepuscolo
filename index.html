<style>

:root{
  --bg:#15140F; --bgimg:none;
  --panel:#F4F2EE; --panel-2:#E9E6E0; --line:#CFCABF;
  --ink:#24221E; --ink-dim:#5E594F; --ink-faint:#8B857A;
  --m1:#5C410E; --m2:#C9A227; --m3:#F7E9A8; --m4:#8A6A17; --m5:#E6CF7A;
  --ring:3px; --polish:.9; --orn:1; --texop:1;
  --display:'Cormorant Garamond',Georgia,serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:var(--bgimg);background-size:cover;
  background-position:center;background-attachment:fixed;color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.45;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:rgba(255,255,255,.62);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--m2);box-shadow:0 0 0 3px rgba(201,162,39,.22)}
textarea{resize:vertical;min-height:74px}
:focus-visible{outline:2px solid var(--m3);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.005em}

/* ---------------- metallo ---------------- */
.metal{background:
  repeating-linear-gradient(102deg,rgba(255,255,255,calc(.07*var(--polish))) 0 1px,
    rgba(0,0,0,calc(.06*var(--polish))) 1px 2px,transparent 2px 4px),
  linear-gradient(128deg,var(--m1) 0%,var(--m2) 14%,var(--m3) 27%,var(--m2) 36%,
    var(--m4) 48%,var(--m5) 62%,var(--m2) 72%,var(--m3) 82%,var(--m4) 91%,var(--m1) 100%)}

/* ---------------- riquadro con intarsio ---------------- */
.slab{position:relative;border-radius:calc(13px + var(--ring));padding:var(--ring);
  margin-bottom:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.45),
    0 3px 8px rgba(0,0,0,.45)}
.slab>.face{border-radius:13px;position:relative;overflow:hidden;background:var(--panel);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.32)}
.tex{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;opacity:var(--texop)}
.veil{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(158deg,rgba(255,255,255,.17),transparent 42%,rgba(0,0,0,.10))}
.orn{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:var(--orn)}
.orn i{position:absolute;width:58px;height:58px;display:block}
.orn i svg{width:100%;height:100%;display:block}
.orn i.tl{left:0;top:0}
.orn i.tr{right:0;top:0;transform:scaleX(-1)}
.orn i.bl{left:0;bottom:0;transform:scaleY(-1)}
.orn i.br{right:0;bottom:0;transform:scale(-1,-1)}
.orn u{position:absolute;left:58px;right:58px;height:14px;display:block;
  background-repeat:repeat-x;background-size:auto 14px;background-position:center}
.orn u.t{top:2px} .orn u.b{bottom:2px;transform:scaleY(-1)}
.pad{position:relative;z-index:3;padding:16px}
.slab.flat>.face>.pad{padding:14px}

/* ---------------- struttura ---------------- */
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:9px;
  padding:9px 12px;background:rgba(21,20,15,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(201,162,39,.35)}
.brandt{font-family:var(--display);font-size:21px;font-weight:700;color:#F2EEE4;line-height:1}
.brandt span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
  color:var(--m2);text-transform:uppercase;margin-top:1px}
.grow{flex:1;min-width:0}
.ico{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
  font-size:16px;color:#2A2007;padding:2px}
.ico>span{width:100%;height:100%;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(0,0,0,.16))}
main{flex:1;max-width:900px;width:100%;margin:0 auto;padding:14px 13px 104px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;
  grid-template-columns:repeat(6,1fr);padding-bottom:var(--safe);
  background:rgba(21,20,15,.93);backdrop-filter:blur(14px);
  border-top:1px solid rgba(201,162,39,.35)}
.tabs button{padding:9px 1px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#8B8574;font-size:9.5px;letter-spacing:-.01em}
.tabs button .g{font-size:17px;line-height:1}
.tabs button[aria-selected=true]{color:var(--m3)}

.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink-faint)}
.faint{color:var(--ink-faint);font-size:13px}
.dim{color:var(--ink-dim)}
.row{display:flex;align-items:center;gap:9px}
.row.wrap{flex-wrap:wrap}
.grid{display:grid;gap:9px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn{border-radius:9px;padding:9px 13px;font-size:14px;background:rgba(255,255,255,.5);
  box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:#8F2130;box-shadow:inset 0 0 0 1px rgba(143,33,48,.4)}
.mbtn{position:relative;border-radius:10px;padding:2px;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 4px rgba(0,0,0,.4)}
.mbtn>span{display:block;border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;
  color:#2A2007;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(0,0,0,.14));text-align:center}
.mbtn.sm>span{padding:6px 11px;font-size:13px}
.mbtn::after{content:'';position:absolute;top:0;bottom:0;width:38%;left:-45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);
  transform:skewX(-16deg);transition:left .55s ease}
.mbtn:active::after{left:120%}
.pill{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:999px;
  box-shadow:inset 0 0 0 1px var(--m2);color:var(--ink-dim)}
.empty{text-align:center;padding:26px 14px;color:var(--ink-faint)}
.empty .g{font-size:32px;display:block;margin-bottom:8px;opacity:.65}
hr.sep{border:0;height:1px;margin:13px 0;background:linear-gradient(90deg,transparent,var(--m2),transparent);opacity:.55}

/* ---------------- libreria ---------------- */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px}
.ph{aspect-ratio:3/4;border-radius:9px;overflow:hidden;position:relative;padding:2px;
  box-shadow:0 1px 3px rgba(0,0,0,.4)}
.ph.circ{aspect-ratio:1/1;border-radius:50%;width:82%;margin:0 auto}
.ph .in2{position:absolute;inset:2px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.32);
  display:grid;place-items:center;box-shadow:inset 0 1px 3px rgba(0,0,0,.34)}
.ph.circ .in2{border-radius:50%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ini{font-family:var(--display);font-size:33px;color:#6C520D}
.nm b{font-family:var(--display);font-size:18px;font-weight:600;display:block;line-height:1.15;margin-top:7px}
.nm i{font-style:normal;font-size:12px;color:var(--ink-faint)}
.lrow{display:flex;align-items:center;gap:11px;width:100%}
.th{width:54px;height:54px;flex:none;border-radius:9px;overflow:hidden;padding:2px;
  box-shadow:0 1px 3px rgba(0,0,0,.4)}
.th.circ{border-radius:50%}
.th .in2{width:100%;height:100%;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.3);
  display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#6C520D}
.th.circ .in2{border-radius:50%}
.th img{width:100%;height:100%;object-fit:cover}

/* ---------------- scheda ---------------- */
.sec{margin-bottom:11px}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;
  font-family:var(--display);font-size:17px;font-weight:600;padding:2px 0 8px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:'';width:9px;height:9px;flex:none;transform:rotate(45deg);
  background:var(--m2);border-radius:2px;transition:transform .25s}
.sec[open]>summary::before{transform:rotate(180deg) scale(.8)}
.fld{margin-bottom:9px}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:3px;display:block}
.stat{border-radius:10px;padding:9px 5px;text-align:center;background:rgba(255,255,255,.42);
  box-shadow:inset 0 0 0 1px var(--line)}
.stat input{background:transparent;border:0;text-align:center;font-family:var(--mono);
  font-size:21px;font-weight:700;padding:1px 0}
.stat .mod{display:inline-block;font-family:var(--mono);font-size:13px;font-weight:700;
  color:#2A2007;border-radius:999px;padding:1px 10px;margin-top:2px}
.line{display:flex;align-items:center;gap:9px;border-radius:9px;padding:8px 10px;
  background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:6px}
.line .v{font-family:var(--mono);font-weight:700;font-size:16px;color:#6C520D;min-width:36px;text-align:center}
.det{max-height:0;opacity:0;overflow:hidden;transition:max-height .34s cubic-bezier(.2,.8,.2,1),opacity .24s}
.det.open{max-height:420px;opacity:1;margin:6px 0 2px}
.det .body{background:rgba(255,255,255,.5);border-radius:9px;padding:10px 12px;font-size:13px;
  line-height:1.6;color:var(--ink-dim);box-shadow:inset 0 0 0 1px var(--line)}
.trk .bar{height:9px;border-radius:99px;background:rgba(0,0,0,.14);overflow:hidden;margin-top:6px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.trk .bar i{display:block;height:100%;background:linear-gradient(90deg,#8F2130,var(--m2))}
.pips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.pip{width:19px;height:19px;border-radius:50%;padding:2px;box-shadow:inset 0 0 0 1px var(--line);
  background:rgba(0,0,0,.08)}
.pip.on{box-shadow:inset 0 0 0 1px var(--m2),0 1px 2px rgba(0,0,0,.3)}
.pip.on>span{display:block;width:100%;height:100%;border-radius:50%}
.newin{animation:newin .4s cubic-bezier(.2,.9,.25,1)}
@keyframes newin{from{opacity:0;transform:translateY(-9px)}}
.hexgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hex{aspect-ratio:1/.92;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:11px;padding:6px;line-height:1.2}
.hex.core{background:rgba(201,162,39,.34);font-weight:600}
.hex.scar{background:rgba(143,33,48,.28)}
.dots{display:flex;gap:4px}
.dot{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);background:rgba(0,0,0,.08)}
.dot.on{background:var(--m2);box-shadow:inset 0 0 0 1px var(--m1)}

/* ---------------- dadi ---------------- */
.dicebar{position:fixed;left:0;right:0;bottom:calc(55px + var(--safe));z-index:44;
  display:flex;gap:6px;overflow-x:auto;padding:8px 10px;scrollbar-width:none;
  background:rgba(21,20,15,.94);border-top:1px solid rgba(201,162,39,.28)}
.dicebar::-webkit-scrollbar{display:none}
.dchip{font-family:var(--mono);font-size:12px;padding:7px 12px;border-radius:999px;flex:none;
  color:#EFE8D8;box-shadow:inset 0 0 0 1px rgba(201,162,39,.5)}
.toastr{position:fixed;left:12px;right:12px;bottom:calc(112px + var(--safe));z-index:60;
  max-width:430px;margin:0 auto;border-radius:12px;padding:2px;
  box-shadow:0 12px 34px rgba(0,0,0,.6);animation:pop .22s ease-out}
.toastr .in3{border-radius:10px;background:#1E1C18;color:#F2EEE4;padding:12px 14px;display:flex;gap:12px}
@keyframes pop{from{transform:translateY(12px) scale(.97);opacity:0}}
.toastr .tot{font-family:var(--mono);font-size:31px;font-weight:700;line-height:1;color:var(--m3)}
.toastr .bk{font-family:var(--mono);font-size:12px;color:#B5AFA0;word-break:break-word}
.die{display:inline-block;padding:1px 6px;border-radius:5px;margin:1px;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.45)}
.die.max{box-shadow:inset 0 0 0 1px #6FA88B;color:#8FCFAE}
.die.min{box-shadow:inset 0 0 0 1px #C2506A;color:#E38699}
.die.drop{opacity:.35;text-decoration:line-through}

/* ---------------- modali ---------------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(8,7,5,.74);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:14px 14px 0 0;
  padding:3px 3px 0;animation:up .24s ease-out}
.modal>.face{border-radius:12px 12px 0 0;background:var(--panel);position:relative;overflow:hidden}
.modal .pad{padding:16px 15px calc(20px + var(--safe))}
@keyframes up{from{transform:translateY(26px);opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + var(--safe));z-index:90;
  background:#221F1A;color:#F0ECE2;border-radius:999px;padding:9px 16px;font-size:13px;
  box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 0 0 1px rgba(201,162,39,.4)}
.slots3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.slot{aspect-ratio:1/1;border-radius:9px;position:relative;overflow:hidden;
  background:rgba(0,0,0,.1);box-shadow:inset 0 0 0 1px var(--line);
  display:grid;place-items:center;font-size:11px;color:var(--ink-faint);
  background-size:cover;background-position:center}
.slot b{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;
  border-radius:6px;font-size:10px;padding:1px 5px;font-weight:400}
.stage{position:relative;margin:12px auto;touch-action:none;background:#151310;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%}
.busy{display:inline-block;width:14px;height:14px;border:2px solid var(--line);
  border-top-color:var(--m2);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------- libreria manuali ---------------- */
.plank{display:flex;align-items:flex-end;gap:6px;padding-bottom:4px;margin-bottom:16px;
  border-bottom:5px solid transparent;border-image:linear-gradient(90deg,var(--m1),var(--m2),var(--m4),var(--m2),var(--m1)) 1;
  min-height:132px}
.spine{flex:1;min-width:0;border-radius:4px 4px 0 0;display:flex;align-items:center;
  justify-content:center;padding:9px 2px;transition:transform .22s cubic-bezier(.2,.9,.25,1);
  box-shadow:inset -3px 0 6px rgba(0,0,0,.35),inset 3px 0 4px rgba(255,255,255,.14)}
.spine:hover,.spine:focus-visible{transform:translateY(-10px)}
.spine b{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);
  font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:112px}
.bookwrap{position:relative;width:100%;aspect-ratio:16/10;perspective:1900px;touch-action:none;
  user-select:none;-webkit-user-select:none;background:#151310;border-radius:8px;overflow:hidden}
.bookwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.pgdom{position:absolute;inset:0;display:flex}
.ppage{flex:1;min-width:0;background:#EDE4D3;color:#3A2F22;overflow:hidden;position:relative}
.ppage canvas{position:static;width:100%;height:100%;object-fit:contain}
.flipw{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;
  transform-style:preserve-3d;transition:transform .58s cubic-bezier(.4,.05,.3,1);opacity:0;pointer-events:none}
.flipw.run{opacity:1}
.fface{position:absolute;inset:0;backface-visibility:hidden;background:#EDE4D3;overflow:hidden}
.fface.bk{transform:rotateY(180deg);background:#E2D7C2}
.fface canvas{position:static;width:100%;height:100%}
#mg stop:nth-child(1),#mg stop:nth-child(6){stop-color:var(--m1)}
#mg stop:nth-child(2){stop-color:var(--m3)}
#mg stop:nth-child(3){stop-color:var(--m2)}

/* ---------------- lettore a tutta pagina ---------------- */
.lettore{position:fixed;inset:0;z-index:86;background:#0E0D0B;display:flex;flex-direction:column;
  padding-bottom:var(--safe)}
.lettore .ltop{display:flex;align-items:center;gap:10px;padding:9px 12px;
  background:rgba(20,18,15,.92);border-bottom:1px solid rgba(201,162,39,.3);color:#F2EEE4}
.lettore .ltop b{font-family:var(--display);font-size:17px;font-weight:600}
.lettore .ltop .faint{color:#9A9285}
.lstage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:8px 8px 0;min-height:0}
.lbook{position:relative;width:100%;height:100%;max-width:1400px;touch-action:none;
  user-select:none;-webkit-user-select:none}
.lbook canvas{position:absolute;inset:0;width:100%;height:100%}
.leggio{width:100%;max-width:1400px;height:34px;flex:none;position:relative}
.leggio svg{width:100%;height:100%;display:block}
.lbar{display:flex;align-items:center;gap:9px;padding:9px 12px;
  background:rgba(20,18,15,.92);border-top:1px solid rgba(201,162,39,.3)}
.lbar input[type=range]{flex:1;accent-color:var(--m2);background:transparent;border:0;padding:0}
.lbar .lb{width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;
  color:#2A2007;font-size:17px;padding:2px}
.lbar .lb>span{width:100%;height:100%;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(0,0,0,.16))}
.lmode{font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:999px;color:#EFE8D8;
  box-shadow:inset 0 0 0 1px rgba(201,162,39,.5);flex:none}
.lmode[aria-pressed=true]{background:rgba(201,162,39,.25);color:#FFF3CF}

/* ---------------- scheda in stile cartaceo ---------------- */
.cartawrap{overflow:hidden;margin-bottom:12px}
.carta{width:860px;transform-origin:top left;color:var(--ink)}
.carta .box{position:relative;border-radius:8px;padding:9px 10px;margin-bottom:8px;
  background:rgba(255,255,255,.42);box-shadow:inset 0 0 0 1.5px var(--m2),inset 0 0 0 3px rgba(255,255,255,.28)}
.carta .box>.tt{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-faint);text-align:center;margin-top:5px}
.carta .cols{display:grid;grid-template-columns:200px 1fr 1fr;gap:10px;align-items:start}
.carta .band{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.carta .band .nome{font-family:var(--display);font-size:27px;font-weight:700;line-height:1.1}
.carta .band input{background:transparent;border:0;padding:0;font-family:var(--display);font-size:16px}
.carta .abi{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:13px}
.carta .abi .pb{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px var(--m2)}
.carta .abi .pb.on{background:var(--m2)}
.carta .abi .nv{font-family:var(--mono);font-weight:700;width:26px;text-align:right}
.carta .abi .an{flex:1}
.carta .abi .aa{font-size:10px;color:var(--ink-faint);text-transform:uppercase;font-family:var(--mono)}
.carta .car{text-align:center;padding:7px 4px 5px}
.carta .car .cn{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.carta .car .cv{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.carta .car .cm{display:inline-block;font-family:var(--mono);font-size:14px;font-weight:700;
  padding:1px 12px;border-radius:999px;margin-top:3px;color:#2A2007}
.carta .tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.carta .big{font-family:var(--mono);font-size:26px;font-weight:700;text-align:center;line-height:1.1}
.carta .mini{font-family:var(--mono);font-size:11px;text-align:center;color:var(--ink-faint)}
.carta table{width:100%;border-collapse:collapse;font-size:12px}
.carta th{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);text-align:left;padding:0 4px 4px}
.carta td{padding:2px 4px;border-bottom:1px solid rgba(0,0,0,.12)}
.carta textarea{background:transparent;border:0;padding:0;font-size:12.5px;min-height:56px;resize:none}
.cartabar{display:flex;gap:7px;align-items:center;margin-bottom:10px}

/* ------------------------------------------------------------- IndexedDB */
var IDB=(function(){
  var dbp;
  function open(){ return dbp||(dbp=new Promise(function(res,rej){
    var r=indexedDB.open('tavolo',1);
    r.onupgradeneeded=function(){var d=r.result;
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('files')) d.createObjectStore('files')};
    r.onsuccess=function(){res(r.result)}; r.onerror=function(){rej(r.error)};
  })) }
  function tx(store,mode,fn){ return open().then(function(d){ return new Promise(function(res,rej){
    var t=d.transaction(store,mode), out=fn(t.objectStore(store));
    t.oncomplete=function(){res(out&&typeof out==='object'&&'result' in out?out.result:out)};
    t.onerror=function(){rej(t.error)};
  })}) }
  return {
    get:function(s,k){return tx(s,'readonly',function(st){return st.get(k)})},
    set:function(s,k,v){return tx(s,'readwrite',function(st){return st.put(v,k)})},
    del:function(s,k){return tx(s,'readwrite',function(st){return st.delete(k)})},
    keys:function(s){return tx(s,'readonly',function(st){return st.getAllKeys()})}
  };
})();

/* ---------------------------------------------------------------- storage */
function FolderStore(root){this.root=root;this.folder=true}
FolderStore.prototype._dir=function(path,create){
  var parts=path.split('/').slice(0,-1), h=Promise.resolve(this.root);
  parts.forEach(function(p){h=h.then(function(d){return d.getDirectoryHandle(p,{create:!!create})})});
  return h;
};
FolderStore.prototype._file=function(path,create){
  return this._dir(path,create).then(function(d){
    return d.getFileHandle(path.split('/').pop(),{create:!!create})})};
FolderStore.prototype.readBlob=function(p){
  return this._file(p).then(function(f){return f.getFile()}).catch(function(){return null})};
FolderStore.prototype.readText=function(p){
  return this.readBlob(p).then(function(b){return b?b.text():null})};
FolderStore.prototype.writeBlob=function(p,b){
  return this._file(p,true).then(function(f){return f.createWritable()})
    .then(function(w){return w.write(b).then(function(){return w.close()})})};
FolderStore.prototype.writeText=function(p,t){
  return this.writeBlob(p,new Blob([t],{type:'application/json'}))};
FolderStore.prototype.remove=function(p){
  return this._dir(p).then(function(d){return d.removeEntry(p.split('/').pop())}).catch(function(){})};
FolderStore.prototype.list=function(dir){
  var h=Promise.resolve(this.root);
  dir.split('/').filter(Boolean).forEach(function(p){
    h=h.then(function(d){return d.getDirectoryHandle(p)})});
  return h.then(function(d){
    var out=[], it=d.entries(), base=dir.replace(/\/$/,'');
    function step(){ return it.next().then(function(r){
      if(r.done) return out;
      if(r.value[1].kind==='file') out.push(base+'/'+r.value[0]);
      return step() }) }
    return step();
  }).catch(function(){return []});
};

function LocalStore(){this.folder=false}
LocalStore.prototype.readBlob=function(p){return IDB.get('files',p).then(function(v){
  if(v==null) return null;
  return typeof v==='string'?new Blob([v],{type:'application/json'}):v})};
LocalStore.prototype.readText=function(p){return IDB.get('files',p).then(function(v){
  if(v==null) return null;
  if(typeof v==='string') return v;
  if(typeof v.text==='function') return v.text();
  return null})};
LocalStore.prototype.writeBlob=function(p,b){return IDB.set('files',p,b)};
LocalStore.prototype.writeText=function(p,t){return IDB.set('files',p,t)};
LocalStore.prototype.remove=function(p){return IDB.del('files',p)};
LocalStore.prototype.list=function(dir){return IDB.keys('files').then(function(k){
  var d=dir.replace(/\/$/,'')+'/';
  return k.filter(function(x){return x.indexOf(d)===0&&x.slice(d.length).indexOf('/')<0})})};

var DB={
  store:null, canFolder:typeof window.showDirectoryPicker==='function', pending:null, name:'',
  init:function(){
    var self=this;
    if(!this.canFolder){ this.store=new LocalStore(); return Promise.resolve() }
    return IDB.get('kv','root').then(function(h){
      if(!h){ self.store=new LocalStore(); return }
      return h.queryPermission({mode:'readwrite'}).then(function(p){
        if(p==='granted'){ self.store=new FolderStore(h); self.name=h.name }
        else { self.pending=h; self.store=new LocalStore() }});
    }).catch(function(){ self.store=new LocalStore() });
  },
  resume:function(){
    var self=this; if(!this.pending) return Promise.resolve(false);
    return this.pending.requestPermission({mode:'readwrite'}).then(function(p){
      if(p!=='granted') return false;
      self.store=new FolderStore(self.pending); self.name=self.pending.name; self.pending=null; return true });
  },
  choose:function(){
    var self=this;
    if(!this.canFolder){ spiegaCartella(); return Promise.resolve(false) }
    return window.showDirectoryPicker({mode:'readwrite',id:'tavolo'}).then(function(h){
      return h.requestPermission({mode:'readwrite'}).then(function(){
        return IDB.set('kv','root',h).then(function(){
          self.store=new FolderStore(h); self.name=h.name; self.pending=null; return true })})});
  },
  readJSON:function(p){return this.store.readText(p).then(function(t){
    try{return t?JSON.parse(t):null}catch(e){return null}})},
  writeJSON:function(p,o){return this.store.writeText(p,JSON.stringify(o,null,2))},
  list:function(d){return this.store.list(d)},
  remove:function(p){return this.store.remove(p)},
  readBlob:function(p){return this.store.readBlob(p)},
  writeBlob:function(p,b){return this.store.writeBlob(p,b)}
};

      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){res(b)},'image/jpeg',q||0.82);

    img.src=url;

/* ---- calcolo automatico D&D ---- */
function compBonus(liv){ return 2+Math.floor((clamp(liv,1,20)-1)/4) }
function modOf(v){ return Math.floor((Number(v||10)-10)/2) }
function dadoIspirazione(liv){
  var d='d6'; Object.keys(USI_ISPIRAZIONE).forEach(function(k){ if(liv>=+k) d=USI_ISPIRAZIONE[k] });
  return d;
}
function slotPatto(liv){
  if(typeof SLOT_PATTO==='undefined') return [];
  var p=SLOT_PATTO[liv]; if(!p) return [];
  var out=[]; for(var i=0;i<p[1];i++) out.push(i===p[1]-1?p[0]:0);
  return out;
}
function autoDnD(pg){
  var v=pg.values, cl=CLASSI[v.classe]||CLASSI.bardo, liv=clamp(Number(v.liv||1),1,20);
  var ed=pg.sys==='dnd24'?'2024':pg.sys==='dnd14'?'2014':'mix';
  var comp=compBonus(liv);
  var cos=modOf(v.cos);
  var pfMax=cl.dv+(liv-1)*(Math.floor(cl.dv/2)+1)+cos*liv;
  var out={
    comp:comp,
    pfMax:Math.max(1,pfMax),
    iniz:modOf(v.des),
    cd:8+comp+modOf(v[cl.carat]),
    atkInc:comp+modOf(v[cl.carat]),
    percPass:10+modOf(v.sag)+((v.abil&&v.abil.percezione?v.abil.percezione:0)?comp:0),
    slot: cl.inc==='pieno' ? (SLOT_PIENI[liv]||[])
        : cl.inc==='mezzo' ? (typeof SLOT_MEZZI!=='undefined'?(SLOT_MEZZI[liv]||[]):[])
        : cl.inc==='patto' ? slotPatto(liv) : [],
    patto: cl.inc==='patto',
    dv: liv+'d'+cl.dv,
    tsComp: cl.ts,
    arm: cl.arm,
    ispirazione: v.classe==='bardo' ? dadoIspirazione(liv) : null,
    priv: cl.f.filter(function(f){
        if(f[1]>liv) return false;
        if(ed==='mix') return true;
        return f[2]==='both'||f[2]===ed;
      }).map(function(f){ return {n:f[0],liv:f[1],ed:f[2],t:f[3]} })
      .sort(function(a,b){return a.liv-b.liv})
  };
  return out;
}

function savePG(pg){
  pg.updatedAt=nowISO();
  return DB.writeJSON(P.pg(pg.id),pg).then(function(){
    var i=-1; S.pgs.forEach(function(m,k){ if(m.id===pg.id) i=k });
    var meta={id:pg.id,sys:pg.sys,name:pg.name,portrait:pg.portrait,shape:pg.shape,
      updatedAt:pg.updatedAt,sub:sottotitolo(pg)};
    if(i>=0) S.pgs[i]=meta; else S.pgs.unshift(meta);
  });
}

function sottotitolo(pg){
  if(!SISTEMI[pg.sys]) return 'sistema non disponibile';
  var v=pg.values, s=SISTEMI[pg.sys].n;
  if(SISTEMI[pg.sys].fam==='custom') return s;
  if(SISTEMI[pg.sys].fam==='dnd') return s+' · '+(CLASSI[v.classe]?CLASSI[v.classe].n:'')+' '+(v.liv||1);
  if(SISTEMI[pg.sys].fam==='fu') return s+' · livello '+(v.liv||5);
  if(SISTEMI[pg.sys].fam==='s7') return s+' · '+(v.nazione||'');
  return s;
}
function loadAll(){
  return DB.readJSON(P.config).then(function(c){
    if(c) Object.keys(c).forEach(function(k){S.cfg[k]=c[k]});
    return DB.list('personaggi');
  }).then(function(ps){
    return Promise.all(ps.map(function(p){return DB.readJSON(p)}));
  }).then(function(list){
    S.pgs=list.filter(Boolean).map(function(c){
      return {id:c.id,sys:c.sys,name:c.name,portrait:c.portrait,shape:c.shape,
              updatedAt:c.updatedAt,sub:sottotitolo(c)}});
    S.pgs.sort(function(a,b){return String(b.updatedAt).localeCompare(String(a.updatedAt))});
    return DB.list('manuali');
  }).then(function(ms){
    return Promise.all(ms.filter(function(p){return /\.json$/.test(p)}).map(function(p){return DB.readJSON(p)}));
  }).then(function(list){
    S.manuals=list.filter(Boolean);
    return loadTextures();
  });
}
function loadTextures(){
  var jobs=[];
  Object.keys(MATERIALI).forEach(function(k){
    S.texUrl[k]=[];
    [0,1,2].forEach(function(i){
      jobs.push(DB.readBlob(P.tex(k,i)).then(function(b){
        if(b) S.texUrl[k][i]=URL.createObjectURL(b) }).catch(function(){}));
    });
  });
  if(S.cfg.hasBg) jobs.push(DB.readBlob(P.bgimg).then(function(b){
    if(b) S.bgUrl=URL.createObjectURL(b) }).catch(function(){}));
  return Promise.all(jobs).then(function(){
    Object.keys(S.texUrl).forEach(function(k){
      S.texUrl[k]=S.texUrl[k].filter(Boolean) });
  });
}

/* ================================================================= dadi */
function rollDice(expr,scope){
  var e=String(expr||'').trim().toLowerCase();
  e=e.replace(/\{([a-z0-9_]+)\}/gi,function(_,k){var x=(scope||{})[k];return (x==null||x==='')?0:x});
  var adv=/\bvan\b|\bvantaggio\b/.test(e), dis=/\bsvan\b|\bsvantaggio\b/.test(e);
  e=e.replace(/\bsvantaggio\b|\bsvan\b|\bvantaggio\b|\bvan\b/g,'');
  if(adv) e=e.replace(/(^|[^0-9])1?d20/,'$12d20kh1');
  if(dis) e=e.replace(/(^|[^0-9])1?d20/,'$12d20kl1');
  var terms=e.replace(/\s+/g,'').replace(/-/g,'+-').split('+').filter(Boolean);
  var total=0, parts=[], d20=null, n20=0;
  terms.forEach(function(t){
    var sign=1; if(t.charAt(0)==='-'){sign=-1;t=t.slice(1)}
    var m=t.match(/^(\d*)d(\d+)(?:(kh|kl|dh|dl)(\d+))?$/);
    if(m){
      var n=clamp(parseInt(m[1]||'1',10),1,100), faces=clamp(parseInt(m[2],10),2,1000);
      var rolls=[], keep=[];
      for(var i=0;i<n;i++){rolls.push(1+Math.floor(Math.random()*faces));keep.push(true)}
      if(m[3]){
        var k=clamp(parseInt(m[4]||'1',10),0,n);
        var ord=rolls.map(function(v,i){return [v,i]}).sort(function(a,b){return a[0]-b[0]});
        var drop = m[3]==='kh'?ord.slice(0,n-k) : m[3]==='kl'?ord.slice(k)
                 : m[3]==='dl'?ord.slice(0,k) : ord.slice(n-k);
        drop.forEach(function(p){keep[p[1]]=false});
      }
      var sum=0, html=rolls.map(function(v,i){
        if(keep[i]) sum+=v;
        var cls=(!keep[i]?'drop':(v===faces?'max':(v===1?'min':'')));
        return '<span class="die '+cls+'">'+v+'</span>'}).join('');
      if(faces===20){ var kept=rolls.filter(function(_,i){return keep[i]}); d20=kept[0]; n20++ }
      total+=sign*sum;
      parts.push((sign<0?'−':'')+n+'d'+faces+' '+html);
    }else{
      var val=Number(t)||0; total+=sign*val;
      if(val) parts.push('<span class="die">'+(sign<0?'−':'+')+val+'</span>');
    }
  });
  return {total:total,html:parts.join(' '),expr:String(expr),
          crit:n20===1&&d20===20, fumble:n20===1&&d20===1};
}

  for(var k=0;k<n&&bag.length;k++){

function pool7(tratto,abil){
  var n=clamp(tratto+abil,1,20), rolls=[];
  for(var i=0;i<n;i++) rolls.push(1+Math.floor(Math.random()*10));
  var sorted=rolls.slice().sort(function(a,b){return b-a});
  var alzate=0, cur=0;
  sorted.forEach(function(v){ cur+=v; if(cur>=10){alzate++;cur=0} });
  return {rolls:rolls,alzate:alzate,resto:cur};
}

var pdfReady=null;
function loadPdfJs(){
  if(pdfReady) return pdfReady;
  pdfReady=new Promise(function(res,rej){
    if(window.pdfjsLib) return res();
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=function(){
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      res();
    };
    s.onerror=function(){ pdfReady=null; rej(new Error('Il lettore PDF non si è caricato. Serve la rete la prima volta.')) };
    document.head.appendChild(s);
  });
  return pdfReady;
}

function pageCanvas(n){
  if(n<1||n>RD.pdf.numPages) return null;
  if(RD.cache[n]) return RD.cache[n];
  var c=document.createElement('canvas');
  c.width=Math.max(2,Math.round(RD.PW*RD.dpr)); c.height=Math.max(2,Math.round(RD.H*RD.dpr));
  var x=c.getContext('2d'); x.fillStyle='#EDE4D3'; x.fillRect(0,0,c.width,c.height);
  RD.cache[n]=c;
  RD.pdf.getPage(n).then(function(p){
    var vp=p.getViewport({scale:1});
    var sc=Math.min(c.width/vp.width,c.height/vp.height);
    var v2=p.getViewport({scale:sc});
    var ox=(c.width-v2.width)/2, oy=(c.height-v2.height)/2;
    x.save(); x.translate(ox,oy);
    p.render({canvasContext:x,viewport:v2}).promise.then(function(){ x.restore(); paint(RD.lastT==null?1:RD.lastT) });
  }).catch(function(){});
  return c;
}
function paint(t){
  if(!RD.ctx) return;
  RD.lastT=t;
  if(S.cfg.sfoglio==='semplice') return paintFlat(t);
  var ctx=RD.ctx, W=RD.W, H=RD.H, PW=RD.PW;
  ctx.clearRect(0,0,W,H);
  var L=pageCanvas(RD.pg), Rr=pageCanvas(t<1?RD.pg+3:RD.pg+1);
  if(L) ctx.drawImage(L,0,0,PW,H);
  if(Rr) ctx.drawImage(Rr,PW,0,PW,H);
  if(t>=1) return;
  var front=pageCanvas(RD.pg+1), back=pageCanvas(RD.pg+2);
  if(!front) return;
  var foldX=PW+PW*t, Rrad=Math.max(9,70*(0.35+0.65*t));
  for(var u=0;u<=PW;u+=1){
    var sx=PW-u, th=u/Rrad, x, src, sxs, shade;
    if(th<=Math.PI){
      x=foldX+Rrad*Math.sin(th);
      if(th<=Math.PI/2){ src=front; sxs=sx; shade=0.30*(1-Math.cos(th)) }
      else { src=back||front; sxs=PW-sx; shade=0.16+0.22*(1+Math.cos(th)) }
    }else{ x=foldX-(u-Math.PI*Rrad); src=back||front; sxs=PW-sx; shade=0.14 }
    if(x<-2||x>W+2||!src) continue;
    var wd=Math.max(1,Math.abs(Math.cos(th))+0.6);
    ctx.save(); ctx.beginPath(); ctx.rect(x,0,wd,H); ctx.clip();
    ctx.drawImage(src,Math.round(sxs*RD.dpr),0,Math.max(1,RD.dpr),src.height,x,0,wd,H);
    if(shade>0.005){ ctx.fillStyle='rgba(58,47,34,'+Math.min(.55,shade)+')'; ctx.fillRect(x,0,wd,H) }
    ctx.restore();
  }
}
function paintFlat(t){
  var ctx=RD.ctx, W=RD.W, H=RD.H, PW=RD.PW;
  ctx.clearRect(0,0,W,H);
  var L=pageCanvas(RD.pg), Rr=pageCanvas(t<1?RD.pg+3:RD.pg+1);
  if(L) ctx.drawImage(L,0,0,PW,H);
  if(Rr) ctx.drawImage(Rr,PW,0,PW,H);
  if(t>=1) return;
  var front=pageCanvas(RD.pg+1), back=pageCanvas(RD.pg+2);
  var w=PW*Math.abs(t*2-1);
  var src=t>0.5?front:back;
  if(!src) return;
  var x=t>0.5?PW:PW-w;
  ctx.save(); ctx.globalAlpha=1;
  ctx.drawImage(src,x,0,w,H);
  ctx.fillStyle='rgba(58,47,34,'+(0.20*(1-Math.abs(t*2-1)))+')';
  ctx.fillRect(x,0,w,H); ctx.restore();
}
function settle(from,complete){
  var to=complete?0:1, t0=performance.now(), dur=complete?400:260;
  RD.busy=true;
  (function step(){
    var k=Math.min(1,(performance.now()-t0)/dur), e=1-Math.pow(1-k,3);
    paint(from+(to-from)*e);
    if(k<1) requestAnimationFrame(step);
    else {
      if(complete){ RD.pg=Math.min(RD.pdf.numPages-1,RD.pg+2); }
      RD.busy=false; paint(1);
      var s=$('#rs'); if(s) s.value=RD.pg;
      if(RD.label) RD.label();
    }
  })();
}
function turnPage(dir){
  if(RD.busy) return;
  if(dir>0){ if(RD.pg+2>RD.pdf.numPages) return; settle(1,true) }
  else { RD.pg=Math.max(1,RD.pg-2); paint(1); var s=$('#rs'); if(s) s.value=RD.pg; if(RD.label) RD.label() }
}

/* ============================================================== ritratto */
function cropPortrait(file,pg){
  var img=new Image(), url=URL.createObjectURL(file);
  img.onload=function(){
    var st={sh:pg.shape||'rect',zoom:1,ox:0,oy:0,base:1};
    var m=modal('<div class="row" style="margin-bottom:6px"><div class="eyebrow grow">Ritaglio</div>'+
      '<button class="btn sm" data-sh="rect">Rettangolo</button>'+
      '<button class="btn sm" data-sh="circle">Cerchio</button></div>'+
      '<div class="stage" id="stg"><canvas id="cc"></canvas></div>'+
      '<div class="row"><span class="lab" style="width:52px;margin:0">Zoom</span>'+
      '<input type="range" id="z" min="100" max="400" value="100" class="grow" style="padding:0;border:0;background:transparent"></div>'+
      '<div class="row" style="margin-top:12px"><button class="btn grow" data-close>Annulla</button>'+
      '<button class="mbtn metal grow" id="okc"><span>Usa</span></button></div>',
    function(el,close){
      var stg=$('#stg',el), cv=$('#cc',el), ctx=cv.getContext('2d');
      var dpr=Math.min(window.devicePixelRatio||1,2.5);
      function box(){ return st.sh==='circle'?{w:250,h:250}:{w:240,h:320} }
      function size(){
        var b=box();
        stg.style.width=b.w+'px'; stg.style.height=b.h+'px';
        stg.style.borderRadius=st.sh==='circle'?'50%':'9px';
        cv.width=b.w*dpr; cv.height=b.h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
        st.base=Math.max(b.w/img.width,b.h/img.height); st.ox=0; st.oy=0;
      }
      function draw(){
        var b=box(), s=st.base*st.zoom, w=img.width*s, h=img.height*s;
        var x=(b.w-w)/2+st.ox, y=(b.h-h)/2+st.oy;
        x=Math.min(0,Math.max(b.w-w,x)); y=Math.min(0,Math.max(b.h-h,y));
        st.ox=x-(b.w-w)/2; st.oy=y-(b.h-h)/2;
        ctx.clearRect(0,0,b.w,b.h); ctx.drawImage(img,x,y,w,h);
      }
      function out(){
        var b=box(), s=st.base*st.zoom, sc=520/b.w;
        var o=document.createElement('canvas');
        o.width=Math.round(b.w*sc); o.height=Math.round(b.h*sc);
        var c2=o.getContext('2d');
        if(st.sh==='circle'){ c2.beginPath(); c2.arc(o.width/2,o.height/2,o.width/2,0,Math.PI*2); c2.clip() }
        var w=img.width*s*sc, h=img.height*s*sc;
        c2.drawImage(img,(o.width-w)/2+st.ox*sc,(o.height-h)/2+st.oy*sc,w,h);
        return o.toDataURL(st.sh==='circle'?'image/png':'image/jpeg',0.86);
      }
      var drag=null;
      stg.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,ox:st.ox,oy:st.oy};
        stg.setPointerCapture(e.pointerId)});
      stg.addEventListener('pointermove',function(e){ if(!drag)return;
        st.ox=drag.ox+(e.clientX-drag.x); st.oy=drag.oy+(e.clientY-drag.y); draw()});
      stg.addEventListener('pointerup',function(){drag=null});
      $('#z',el).oninput=function(){st.zoom=+this.value/100;draw()};
      $$('[data-sh]',el).forEach(function(b){
        if(b.dataset.sh===st.sh) b.style.boxShadow='inset 0 0 0 2px var(--m2)';
        b.onclick=function(){
          st.sh=b.dataset.sh; st.zoom=1; $('#z',el).value=100;
          $$('[data-sh]',el).forEach(function(o){o.style.boxShadow=o===b?'inset 0 0 0 2px var(--m2)':''});
          size(); draw();
        };
      });
      $('#okc',el).onclick=function(){
        pg.portrait=out(); pg.shape=st.sh;
        URL.revokeObjectURL(url); close();
        savePG(pg).then(render);
      };
      size(); draw();
    });
  };
  img.onerror=function(){ toast('Immagine non leggibile') };
  img.src=url;
}

function stepTurno(dir){
  var s=S.sess, ord=s.k.slice().sort(function(a,b){return (b.init||0)-(a.init||0)});
  if(!ord.length) return;
  var i=-1; ord.forEach(function(k,n){ if(k.id===s.turno) i=n });
  i = i<0 ? 0 : i+dir;
  if(i>=ord.length){ i=0; s.round++ }
  if(i<0){ i=ord.length-1; s.round=Math.max(1,s.round-1) }
  s.turno=ord[i].id;
  s.log.unshift({t:nowISO(),txt:'Round '+s.round+' · tocca a '+ord[i].n});
  saveSess(); render();
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-tabgo],[data-open],[data-lay],[data-act],[data-roll],[data-quick],'+
    '[data-abil],[data-slot],[data-pf],[data-fu],[data-fupv],[data-fupm],[data-status],[data-hex],[data-draw],'+
    '[data-tratto],[data-abils7],[data-addrow],[data-delrow],[data-rollrow],[data-det],[data-set],[data-tex],'+
    '[data-textdel],[data-useprof],[data-delprof],[data-man],[data-delman],[data-hp],[data-ini],[data-delk],[data-addpg]');
  if(!t) return;
  var d=t.dataset, pg=S.pg, v=pg?pg.values:null;

  if(d.tab){ S.tab=d.tab; renderFromTop(); return }
  if(d.tabgo){ S.tab=d.tabgo; renderFromTop(); return }
  if(d.lay){ S.cfg.layout=d.lay; saveCfgSoon(); render(); return }
  if(d.open){
    DB.readJSON(P.pg(d.open)).then(function(c){
      if(!c) return toast('Scheda non trovata');
      S.pg=c; S.cfg.lastPg=c.id; saveCfgSoon(); S.tab='scheda'; renderFromTop();
    });
    return;
  }
  if(d.roll!==undefined){ showRoll(d.rl||'Tiro',rollDice(d.roll)); return }
  if(d.quick!==undefined){ showRoll(d.quick,rollDice(d.quick)); return }
  if(d.det){

    if(el) el.classList.toggle('open');
    return;
  }
  if(d.abil){ v.abil=v.abil||{}; v.abil[d.abil]=((v.abil[d.abil]||0)+1)%3; savePGSoon(); render(); return }
  if(d.slot){
    v.slotUsati=v.slotUsati||{};
    var cur=v.slotUsati[d.slot]||0, n=Number(d.n);
    v.slotUsati[d.slot]= cur===n ? n-1 : n;
    savePGSoon(); render(); return;
  }
  if(d.pf){ v.pf.cur=Number(v.pf.cur||0)+Number(d.pf); savePGSoon(); render(); return }
  if(d.fu){ v[d.fu]=Number(d.t); savePGSoon(); render(); return }
  if(d.fupv){ v.pvCur=Number(v.pvCur||0)+Number(d.fupv); savePGSoon(); render(); return }
  if(d.fupm){ v.pmCur=Number(v.pmCur||0)+Number(d.fupm); savePGSoon(); render(); return }
  if(d.status){ v.status=v.status||{}; v.status[d.status]=!v.status[d.status]; savePGSoon(); render(); return }

      '<input id="hx" value="'+esc(v.hex[i]||'')+'" style="margin:12px 0" placeholder="Scrivi il tratto">'+

        if($('#sc',el2).checked) v.cicatrici.push(i);
        savePGSoon(); close(); render();
      };
    });
    return;
  }
  if(d.draw){
    var res=drawTokens(Number(v.tokenPos||0),Number(v.tokenNeg||0),Number(d.draw));
    if(!res) return toast('Il sacchetto è vuoto');
    var bianchi=res.filter(function(x){return x===1}).length;

      html:res.map(function(x){return '<span class="die '+(x?'max':'min')+'">'+(x?'○':'●')+'</span>'}).join('')},
      '<div style="margin-top:4px;color:'+(bianchi?'var(--m3)':'#E38699')+'">'+
      (bianchi?'riesci · '+(res.length-bianchi)+' complicazioni':'fallisci')+'</div>');
    return;
  }
  if(d.tratto){ v.tratti=v.tratti||{};
    v.tratti[d.tratto]= v.tratti[d.tratto]===Number(d.n)?Number(d.n)-1:Number(d.n); savePGSoon(); render(); return }
  if(d.abils7){ v.abil=v.abil||{};
    v.abil[d.abils7]= v.abil[d.abils7]===Number(d.n)?Number(d.n)-1:Number(d.n); savePGSoon(); render(); return }
  if(d.addrow){ v[d.addrow]=(v[d.addrow]||[]).concat([{}]); savePGSoon(); render(); return }
  if(d.delrow){ v[d.delrow].splice(Number(d.i),1); savePGSoon(); render(); return }
  if(d.rollrow){

    var expr=d.tpl.replace(/\{(\w+)\}/g,function(_,k){return row[k]||0});
    showRoll(row.nome||'Tiro',rollDice(expr)); return;
  }
  if(d.set){ S.cfg[d.set]=isNaN(d.val)?d.val:d.val; saveCfgSoon(); applyTheme(); render(); return }
  if(d.textdel!==undefined){
    e.stopPropagation();
    DB.remove(P.tex(S.cfg.mat,Number(d.textdel))).then(loadTextures).then(function(){applyTheme();render()});
    return;
  }
  if(d.tex!==undefined){
    pickFile('image/*').then(function(fs){ if(!fs[0]) return;
      shrink(fs[0],1200,0.82).then(function(b){
        return DB.writeBlob(P.tex(S.cfg.mat,Number(d.tex)),b);
      }).then(loadTextures).then(function(){applyTheme();render();toast('Texture salvata')})
      .catch(function(){toast('Immagine non valida')});
    });
    return;
  }
  if(d.useprof!==undefined){
    var p=S.cfg.profili[Number(d.useprof)];
    Object.keys(p.s).forEach(function(k){S.cfg[k]=p.s[k]});
    saveCfg(); applyTheme(); render(); return;
  }
  if(d.delprof!==undefined){ S.cfg.profili.splice(Number(d.delprof),1); saveCfg(); render(); return }
  if(d.man){ openManual(d.man); return }
  if(d.delman){
    ask('Elimina manuale','Il PDF viene rimosso dalla cartella dell\u2019app.','Elimina').then(function(y){
      if(!y) return;
      Promise.all([DB.remove(P.manual(d.delman)),DB.remove(P.pdf(d.delman))]).then(function(){
        S.manuals=S.manuals.filter(function(m){return m.id!==d.delman}); render();
      });
    });
    return;
  }
  if(d.hp){
    S.sess.k.forEach(function(k){ if(k.id===d.hp){
      k.pf=Number(k.pf||0)+Number(d.d);
      S.sess.log.unshift({t:nowISO(),txt:k.n+': '+(d.d>0?'+':'')+d.d+' PF → '+k.pf});
    }});
    saveSess(); render(); return;
  }
  if(d.ini){
    S.sess.k.forEach(function(k){ if(k.id===d.ini){
      var r=rollDice('1d20+'+(k.ini||0)); k.init=r.total;
      S.sess.log.unshift({t:nowISO(),txt:'Iniziativa '+k.n+': '+r.total});
    }});
    saveSess(); render(); return;
  }
  if(d.delk){ S.sess.k=S.sess.k.filter(function(k){return k.id!==d.delk}); saveSess(); render(); return }
  if(d.act && ACT[d.act]) ACT[d.act](t);
},false);

document.addEventListener('input',function(e){
  var el=e.target, d=el.dataset, pg=S.pg;
  if(d.rng){ S.cfg[d.rng]=Number(el.value); applyTheme();
    var p=el.parentNode.querySelector('.pill'); if(p) p.textContent=el.value;
    saveCfgSoon(); return }
  if(d.bgc!==undefined){ S.cfg.bg=el.value; applyTheme(); saveCfgSoon(); return }
  if(d.sesst!==undefined && S.sess){ S.sess.titolo=el.value; saveSess(); return }
  if(!pg) return;
  var v=pg.values;
  if(d.name!==undefined){ pg.name=el.value; savePGSoon(); return }
  if(d.notes!==undefined){ pg.notes=el.value; savePGSoon(); return }
  if(d.v!==undefined){
    v[d.v]= el.type==='number' ? (el.value===''?'':Number(el.value)) : el.value;
    savePGSoon();
    if(['classe','liv','forza','des','cos','int','sag','car','destrezza','intuito','vigore','volonta',
        'pvExtra','pmExtra','piExtra'].indexOf(d.v)>=0){ clearTimeout(el._r);
      el._r=setTimeout(function(){ render() },520) }
    return;
  }
  if(d.v2!==undefined){
    var parts=d.v2.split('.'); v[parts[0]]=v[parts[0]]||{}; v[parts[0]][parts[1]]=el.value; savePGSoon(); return;
  }
  if(d.cell!==undefined){
    var arr=v[d.cell]||[]; arr[Number(d.i)]=arr[Number(d.i)]||{};
    arr[Number(d.i)][d.c]=el.value; v[d.cell]=arr; savePGSoon(); return;
  }
  if(d.pfcur!==undefined){ v.pf.cur=Number(el.value||0); savePGSoon(); return }
  if(d.fucur!==undefined){ v[d.fucur]=Number(el.value||0); savePGSoon(); return }
  if(d.trc!==undefined||d.trm!==undefined){
    var id2=d.trc||d.trm, t2=v[id2]||{cur:0,max:0};
    if(d.trc!==undefined) t2.cur=Number(el.value||0); else t2.max=Number(el.value||0);
    v[id2]=t2; savePGSoon(); return;
  }
  if(d.forzastudio!==undefined){ S.cfg.forzaStudio=el.checked; saveCfg(); render(); return }
},false);

}
function chiediPersistenza(){
  if(navigator.storage&&navigator.storage.persist){
    navigator.storage.persisted().then(function(ok){
      if(!ok) navigator.storage.persist().catch(function(){});
    }).catch(function(){});
  }
}
(function boot(){
  chiediPersistenza();
  DB.init().then(loadAll).then(function(){
    if(S.cfg.lastPg) return DB.readJSON(P.pg(S.cfg.lastPg)).then(function(c){ if(c) S.pg=c });
  }).then(function(){
    return DB.list('sessioni').then(function(ps){
      return Promise.all(ps.map(function(p){return DB.readJSON(p)}));
    }).then(function(all){
      var open=all.filter(Boolean).filter(function(s){return s.aperta});
      open.sort(function(a,b){return String(b.data).localeCompare(String(a.data))});

})();

<script>
"use strict";
/* ========================================================== compendio SRD */
function incObj(a){
  return {nome:a[0],liv:a[1],scuola:a[2],tempo:a[3],gittata:a[4],durata:a[5],classi:a[6],note:a[7]};
}
var CLASSE_SIGLA={bardo:'b',chierico:'c',mago:'m',ladro:'',guerriero:'',barbaro:''};
function viewCompendio(){
  var out=slab('<div class="eyebrow">Compendio</div>'+
    '<p class="faint" style="margin:7px 0 11px">Regole aperte di D&amp;D pubblicate da Wizards of the Coast '+
    'con licenza Creative Commons. Cercabili, e inseribili nelle schede con un tocco.</p>'+
    '<input id="cq" placeholder="Cerca un incantesimo, un\u2019arma, una condizione" data-cq>'+
    '<div class="row" style="margin-top:9px">'+
    [['inc','Incantesimi'],['armi','Armi'],['cond','Condizioni'],['az','Azioni'],['mie','Le mie voci']].map(function(t){
      return '<button class="btn sm grow" data-cs="'+t[0]+'"'+
        (S.compSez===t[0]?' style="box-shadow:inset 0 0 0 2px var(--m2)"':'')+'>'+t[1]+'</button>'}).join('')+
    '</div>');
  out+=slab('<div id="cres">'+compLista('')+'</div>',{plain:true});
  return out;
}
function compLista(q){
  q=(q||'').toLowerCase();
  var sez=S.compSez||'inc', h='';
  if(sez==='inc'){
    var list=SRD_INC.map(incObj).filter(function(s){
      return !q||s.nome.toLowerCase().indexOf(q)>=0||(s.scuola||'').toLowerCase().indexOf(q)>=0});
    list.sort(function(a,b){return a.nome.localeCompare(b.nome,'it')});
    h=list.map(function(s,i){
      return '<div class="line" data-det="cc'+i+'"><span class="v">'+(s.liv===0?'T':s.liv)+'</span>'+
        '<span class="grow">'+esc(s.nome)+'<span class="faint" style="font-size:11px"> '+esc(s.scuola)+'</span></span>'+
        (S.pg&&SISTEMI[S.pg.sys].fam==='dnd'?'<button class="btn sm" data-addinc="'+esc(s.nome)+'">＋</button>':'')+
        '</div><div class="det" id="cc'+i+'"><div class="body"><b>'+esc(s.tempo)+'</b> · '+
        esc(s.gittata)+' · '+esc(s.durata)+'<br>'+esc(s.note)+'</div></div>'}).join('');
    if(!list.length) h='<p class="faint">Nessun incantesimo con questo nome.</p>';
  }else if(sez==='armi'){
    var a2=SRD_ARMI.filter(function(w){return !q||w[0].toLowerCase().indexOf(q)>=0});
    h=a2.map(function(w,i){
      return '<div class="line" data-det="cw'+i+'"><span class="v">'+esc(w[2])+'</span>'+
        '<span class="grow">'+esc(w[0])+'</span>'+
        (S.pg&&SISTEMI[S.pg.sys].fam==='dnd'?'<button class="btn sm" data-addarma="'+esc(w[0])+'">＋</button>':'')+
        '</div><div class="det" id="cw'+i+'"><div class="body">'+esc(w[1])+' · danni '+esc(w[2])+' '+esc(w[3])+
        (w[4]?'<br>'+esc(w[4]):'')+(w[5]?'<br>gittata '+esc(w[5]):'')+'</div></div>'}).join('');
  }else if(sez==='cond'){
    h=SRD_COND.filter(function(c){return !q||c[0].toLowerCase().indexOf(q)>=0})
      .map(function(c,i){
      return '<div class="line" data-det="ck'+i+'"><span class="grow">'+esc(c[0])+'</span>'+
        '<span class="pill">leggi</span></div><div class="det" id="ck'+i+'"><div class="body">'+esc(c[1])+'</div></div>'}).join('');
  }else if(sez==='mie'){
    var sys=(S.pg&&S.pg.sys)||'dnd24';
    var voci=(S.compUser&&S.compUser[sys])||[];
    voci=voci.filter(function(x){return !q||String(x.nome).toLowerCase().indexOf(q)>=0});
    voci.sort(function(a,b){return String(a.nome).localeCompare(String(b.nome),'it')});
    h='<p class="faint" style="margin:0 0 9px">Voci ricavate dai tuoi manuali per '+
      esc(SISTEMI[sys]?SISTEMI[sys].n:sys)+'. Restano nella tua cartella.</p>'+
      (voci.length?voci.map(function(x,i){
        return '<div class="line" data-det="cu'+i+'"><span class="grow">'+esc(x.nome)+'</span>'+
          '<span class="pill">'+esc(x.tipo||'regola')+'</span></div>'+
          '<div class="det" id="cu'+i+'"><div class="body">'+esc(x.testo||'')+'</div></div>'}).join('')
       :'<p class="faint">Ancora nessuna. Con un modello locale puoi ricavarle dai PDF che possiedi.</p>')+
      '<button class="mbtn metal" style="width:100%;margin-top:11px" data-act="iaPannello">'+
      '<span>Modello locale</span></button>';
  }else{
    h=SRD_AZIONI.filter(function(c){return !q||c[0].toLowerCase().indexOf(q)>=0})
      .map(function(c,i){
      return '<div class="line" data-det="ca'+i+'"><span class="grow">'+esc(c[0])+'</span>'+
        '<span class="pill">'+esc(c[1])+'</span></div><div class="det" id="ca'+i+'"><div class="body">'+esc(c[2])+'</div></div>'}).join('');
  }
  return h;
}
ACT.pickinc=function(){
  var v=S.pg.values, cl=S.pg.values.classe, sigla={bardo:'b',chierico:'c',mago:'m'}[cl];
  var list=SRD_INC.map(incObj);
  if(sigla) list=list.filter(function(s){return s.classi.indexOf(sigla)>=0});
  list.sort(function(a,b){return a.liv-b.liv||a.nome.localeCompare(b.nome,'it')});
  var m=modal('<h2 style="font-size:19px">Aggiungi incantesimi</h2>'+
    '<p class="faint" style="margin:7px 0 10px">'+(sigla?'Filtrati per la tua classe. ':'')+
    'Tocca il nome per leggere, il più per aggiungerlo.</p>'+
    '<input id="pq" placeholder="Cerca" style="margin-bottom:10px">'+
    '<div id="pl" style="max-height:52vh;overflow-y:auto"></div>'+
    '<button class="btn" style="width:100%;margin-top:12px" data-close>Fatto</button>',
  function(el,close){
    function draw(q){
      q=(q||'').toLowerCase();
      var f=list.filter(function(s){return !q||s.nome.toLowerCase().indexOf(q)>=0});
      var cur={}; (v.incant||[]).forEach(function(x){cur[x.nome]=1});
      $('#pl',el).innerHTML=f.map(function(s,i){
        return '<div class="line" data-det="pk'+i+'"><span class="v">'+(s.liv===0?'T':s.liv)+'</span>'+
          '<span class="grow">'+esc(s.nome)+'<span class="faint" style="font-size:11px"> '+esc(s.scuola)+'</span></span>'+
          (cur[s.nome]?'<span class="pill">già presente</span>'
            :'<button class="btn sm" data-pinc="'+esc(s.nome)+'">＋</button>')+
          '</div><div class="det" id="pk'+i+'"><div class="body"><b>'+esc(s.tempo)+'</b> · '+
          esc(s.gittata)+' · '+esc(s.durata)+'<br>'+esc(s.note)+'</div></div>'}).join('')
        ||'<p class="faint">Nessun risultato.</p>';
      $$('[data-pinc]',el).forEach(function(b){ b.onclick=function(ev){
        ev.stopPropagation();
        var s=null; list.forEach(function(x){if(x.nome===b.dataset.pinc)s=x});
        v.incant=(v.incant||[]).concat([s]);
        savePGSoon(); b.outerHTML='<span class="pill">aggiunto</span>';
      }});
    }
    $('#pq',el).oninput=function(){draw(this.value)};
    draw('');
  });
};
ACT.pickarma=function(){
  var v=S.pg.values, A=autoDnD(S.pg), cl=CLASSI[v.classe];
  modal('<h2 style="font-size:19px">Aggiungi un\u2019arma</h2>'+
    '<p class="faint" style="margin:7px 0 10px">Il tiro per colpire e i danni vengono calcolati con la '+
    'caratteristica giusta: Forza in mischia, Destrezza se l\u2019arma è accurata o a distanza.</p>'+
    '<div id="wl" style="max-height:56vh;overflow-y:auto">'+SRD_ARMI.map(function(w,i){
      return '<div class="line" data-det="wa'+i+'"><span class="v">'+esc(w[2])+'</span>'+
        '<span class="grow">'+esc(w[0])+'</span><button class="btn sm" data-parma="'+i+'">＋</button></div>'+
        '<div class="det" id="wa'+i+'"><div class="body">'+esc(w[1])+' · '+esc(w[3])+
        (w[4]?'<br>'+esc(w[4]):'')+'</div></div>'}).join('')+'</div>'+
    '<button class="btn" style="width:100%;margin-top:12px" data-close>Fatto</button>',
  function(el,close){
    $$('[data-parma]',el).forEach(function(b){ b.onclick=function(ev){
      ev.stopPropagation();
      var w=SRD_ARMI[Number(b.dataset.parma)];
      var acc=/accurata/.test(w[4])||/distanza/.test(w[1]);
      var car=acc?Math.max(modOf(v.forza),modOf(v.des)):modOf(v.forza);
      var bonus=car+A.comp;
      v.atk=(v.atk||[]).concat([{nome:w[0],bonus:(bonus>=0?'+':'')+bonus,
        danni:w[2]+(car>=0?'+':'')+car,tipo:w[3],prop:w[4]}]);
      savePGSoon();
      b.outerHTML='<span class="pill">aggiunta</span>';
    }});
  });
};

<script>
"use strict";
/* ============================================================== sessioni */
function sessNuova(sys,titolo){
  return {id:uid('ses'),sys:sys,titolo:titolo||('Sessione del '+new Date().toLocaleDateString('it-IT')),
    data:nowISO(),aperta:true,round:1,turno:null,k:[],log:[],diario:[],pgIds:[],stati:{},snapshot:{}};
}
function caricaSessioni(){
  return DB.list('sessioni').then(function(ps){
    return Promise.all(ps.map(function(p){return DB.readJSON(p)}));
  }).then(function(all){
    S.sessioni=all.filter(Boolean).sort(function(a,b){return String(b.data).localeCompare(String(a.data))});
    return S.sessioni;
  }).catch(function(){ S.sessioni=[]; return [] });
}
function viewSess(){
  if(!S.sess) return viewSessLista();

  out+=slab('<div class="row"><div class="grow">'+

    'font-family:var(--display);font-size:20px;font-weight:700">'+
    '<div class="faint">'+esc(SISTEMI[s.sys].n)+' · '+new Date(s.data).toLocaleDateString('it-IT')+

    '<button class="btn sm" data-act="menusess">⋯</button></div>'+
    '<div class="row" style="margin-top:11px;gap:7px">'+
    '<button class="mbtn metal grow" data-act="attacca"><span>Attacca</span></button>'+
    '<button class="mbtn metal grow" data-act="azione"><span>Azione</span></button>'+
    '<button class="btn" data-act="stati">Stati</button></div>');

    '<div class="row wrap">'+attivi.map(function(k){
      return '<button class="pill" data-offstato="'+esc(k)+'" style="box-shadow:inset 0 0 0 2px var(--m2);color:var(--ink)">● '+

        (k.pf==null?'–':k.pf)+'</span>'+

        '<button class="btn sm danger" data-delk="'+k.id+'">✕</button></div>'}).join('')+
      '<div class="row" style="margin-top:9px"><button class="btn grow" data-act="turnoprec">◀</button>'+

  out+=slab('<div class="row" style="margin-bottom:9px"><div class="eyebrow grow">Diario</div>'+

      return '<div class="line" data-det="dr'+i+'"><span class="grow">'+esc(n.txt.slice(0,60))+

        '<div class="det" id="dr'+i+'"><div class="body">'+esc(n.txt)+'</div></div>'}).join('')
     :'<p class="faint">Quello che succede, scritto come lo racconteresti dopo.</p>'));

  out+=slab('<div class="eyebrow" style="margin-bottom:8px">Cronologia dei tiri</div>'+
    (s.log.length?s.log.slice(0,50).map(function(l){
      return '<div style="font-family:var(--mono);font-size:12px;padding:5px 0;border-bottom:1px solid var(--line);color:var(--ink-dim)">'+
        '<span style="color:var(--ink-faint)">'+hhmm(l.t)+'</span> '+esc(l.txt)+'</div>'}).join('')
     :'<p class="faint">Ogni tiro finisce qui.</p>'),{plain:true});
  return out;
}
function viewSessLista(){
  var out=slab('<div class="row"><div class="grow"><div class="eyebrow">Sessioni</div>'+
    '<div class="faint">'+S.sessioni.length+' salvate</div></div>'+
    '<button class="mbtn metal" data-act="nuovasess"><span>Nuova</span></button></div>');
  if(!S.sessioni.length) return out+slab('<div class="empty"><span class="g">⚔</span>'+
    'Nessuna sessione.<br>Ogni sessione è un diario legato a un gioco, e ricorda lo stato delle schede.</div>',{plain:true});
  var per={};
  S.sessioni.forEach(function(s){ (per[s.sys]=per[s.sys]||[]).push(s) });
  Object.keys(per).forEach(function(sys){
    out+=slab('<div class="eyebrow" style="margin-bottom:8px">'+esc(SISTEMI[sys]?SISTEMI[sys].n:sys)+'</div>'+

ACT.attacca=function(){
  var pg=S.pg;
  if(!pg||SISTEMI[pg.sys].fam!=='dnd')

  function(el,close){
    $('#ba',el).onclick=function(){ close(); attaccoArma() };
    $('#bm',el).onclick=function(){ close(); attaccoMagia() };
  });

function statoAttivo(nome){
  var k=Object.keys((S.sess&&S.sess.stati)||{});
  for(var i=0;i<k.length;i++) if(S.sess.stati[k[i]]&&k[i].indexOf(nome)>=0) return true;
  return false;
}
function suggerimenti(pg){
  var v=pg.values, out=[], liv=Number(v.liv||1);
  if(v.classe==='barbaro'&&statoAttivo('Ira'))
    out.push({n:'Ira',t:'Aggiungi i danni da ira in mischia con Forza: +2 fino all\u20198° livello, +3 fino al 15°, poi +4.',
      dmg:liv>=16?4:liv>=9?3:2});
  if(v.classe==='ladro')
    out.push({n:'Attacco furtivo',t:'Se hai vantaggio, o se un alleato è entro 1,5 m dal bersaglio, aggiungi i dadi di Attacco furtivo.',
      dice:Math.ceil(liv/2)+'d6'});
  if(v.classe==='bardo')
    out.push({n:'Ispirazione bardica',t:'Se un alleato te l\u2019ha data, aggiungi il dado al tiro per colpire dopo aver visto il risultato.',
      dice:dadoIspirazione(liv)});
  if(v.classe==='guerriero'&&liv>=3)
    out.push({n:'Manovre',t:'Se sei un maestro di battaglia, puoi spendere un dado di superiorità per una manovra.'});
  if(statoAttivo('Concentrazione'))
    out.push({n:'Concentrazione attiva',t:'Ricorda il tiro salvezza su Costituzione se subisci danni.'});
  return out;
}
function attaccoArma(){
  var pg=S.pg, v=pg.values, A=autoDnD(pg);
  var armi=v.atk||[];
  if(!armi.length) return toast('Aggiungi prima un\u2019arma dalla scheda');
  modal('<h2 style="font-size:19px">Con quale arma?</h2>'+
    '<div style="margin:11px 0">'+armi.map(function(w,i){
      return '<div class="line"><span class="grow">'+esc(w.nome||'arma')+'</span>'+
        '<span class="pill">'+esc(w.bonus||'')+'</span>'+
        '<button class="btn sm" data-warm="'+i+'">scegli</button></div>'}).join('')+'</div>'+
    '<button class="btn" style="width:100%" data-close>Annulla</button>',
  function(el,close){
    $$('[data-warm]',el).forEach(function(b){ b.onclick=function(){
      close(); tiroAttacco(armi[Number(b.dataset.warm)],A) }});
  });
}
function attaccoMagia(){
  var pg=S.pg, v=pg.values, A=autoDnD(pg);
  var inc=v.incant||[];
  modal('<h2 style="font-size:19px">Attacco magico</h2>'+
    '<div class="grid g2" style="margin:11px 0">'+
    autoCell('Bonus di attacco',(A.atkInc>=0?'+':'')+A.atkInc)+
    autoCell('CD tiro salvezza',A.cd)+'</div>'+
    (inc.length?'<div class="eyebrow" style="margin-bottom:7px">I tuoi incantesimi</div>'+
      inc.map(function(s,i){
        return '<div class="line" data-det="am'+i+'"><span class="v">'+(s.liv===0?'T':s.liv)+'</span>'+
          '<span class="grow">'+esc(s.nome)+'</span>'+
          '<button class="btn sm" data-minc="'+i+'">usa</button></div>'+
          '<div class="det" id="am'+i+'"><div class="body">'+esc(s.note||'')+'</div></div>'}).join('')
     :'<p class="faint">Nessun incantesimo in scheda.</p>')+
    '<button class="btn" style="width:100%;margin-top:12px" data-close>Chiudi</button>',
  function(el,close){
    $$('[data-minc]',el).forEach(function(b){ b.onclick=function(){
      var s=inc[Number(b.dataset.minc)];
      close();
      tiroAttacco({nome:s.nome,bonus:(A.atkInc>=0?'+':'')+A.atkInc,danni:'',magia:true,cd:A.cd,note:s.note},A);
    }});
  });
}
function tiroAttacco(arma,A){
  var pg=S.pg, sugg=suggerimenti(pg);
  var bonus=parseInt(String(arma.bonus||'0').replace('+',''),10)||0;
  modal('<h2 style="font-size:19px">'+esc(arma.nome)+'</h2>'+
    (arma.magia?'<p class="faint" style="margin:7px 0 0">CD del tiro salvezza: <b style="color:var(--ink)">'+arma.cd+'</b></p>':'')+
    '<div class="eyebrow" style="margin:12px 0 7px">Tiro per colpire</div>'+
    '<div class="row" style="gap:6px"><button class="btn sm grow" data-mode="normale" aria-pressed="true">Normale</button>'+
    '<button class="btn sm grow" data-mode="van">Vantaggio</button>'+
    '<button class="btn sm grow" data-mode="svan">Svantaggio</button></div>'+
    '<div class="row" style="margin-top:9px">'+
    '<button class="mbtn metal grow" id="tira"><span>Tira l\u2019app</span></button>'+
    '<input id="man" type="number" inputmode="numeric" placeholder="d20 tirato da te" style="flex:1">'+
    '<button class="btn" id="calc">Calcola</button></div>'+
    '<div id="ris" style="margin-top:11px"></div>'+
    (arma.danni?'<div class="eyebrow" style="margin:14px 0 7px">Danni</div>'+
      '<div class="row"><button class="mbtn metal grow" id="dmg"><span>Tira '+esc(arma.danni)+'</span></button>'+
      '<button class="btn" id="dmgc">Critico</button></div><div id="dris" style="margin-top:9px"></div>':'')+
    (sugg.length?'<div class="eyebrow" style="margin:14px 0 7px">Puoi usare anche</div>'+
      sugg.map(function(s,i){
        return '<div class="line" data-det="sg'+i+'"><span class="grow">'+esc(s.n)+'</span>'+
          (s.dice?'<button class="btn sm" data-sdice="'+esc(s.dice)+'">'+esc(s.dice)+'</button>':'')+
          (s.dmg?'<span class="pill">+'+s.dmg+'</span>':'')+'</div>'+
          '<div class="det" id="sg'+i+'"><div class="body">'+esc(s.t)+'</div></div>'}).join(''):'')+
    '<button class="btn" style="width:100%;margin-top:14px" data-close>Chiudi</button>',
  function(el,close){
    var mode='normale';
    $$('[data-mode]',el).forEach(function(b){ b.onclick=function(){
      mode=b.dataset.mode;
      $$('[data-mode]',el).forEach(function(o){
        o.setAttribute('aria-pressed',o===b);
        o.style.boxShadow=o===b?'inset 0 0 0 2px var(--m2)':''});
    }});
    function mostra(d20,tot,crit){
      $('#ris',el).innerHTML='<div class="line" style="box-shadow:inset 0 0 0 2px var(--m2)">'+
        '<span class="v">'+tot+'</span><span class="grow">'+(crit?'colpo critico':'totale sul bersaglio')+
        '</span><span class="pill">d20 '+d20+'</span></div>';
      if(S.sess){ S.sess.log.unshift({t:nowISO(),txt:arma.nome+': attacco '+tot+(crit?' critico':'')});
        saveSess() }
    }
    $('#tira',el).onclick=function(){
      var e='1d20'+(mode==='van'?' van':mode==='svan'?' svan':'')+(bonus>=0?'+':'')+bonus;
      var r=rollDice(e);
      var d20=r.total-bonus;
      mostra(d20,r.total,d20===20);
    };
    $('#calc',el).onclick=function(){
      var d=parseInt($('#man',el).value,10);
      if(isNaN(d)) return toast('Scrivi il risultato del d20');
      mostra(d,d+bonus,d===20);
    };
    if($('#dmg',el)){
      var tiraDanni=function(crit){
        var e=arma.danni;
        if(crit) e=e.replace(/(\d*)d(\d+)/,function(_,n,f){return (2*(parseInt(n||'1',10)))+'d'+f});
        var bonusIra=0;
        sugg.forEach(function(s){ if(s.dmg) bonusIra+=s.dmg });
        var r=rollDice(e+(bonusIra?'+'+bonusIra:''));
        $('#dris',el).innerHTML='<div class="line"><span class="v">'+r.total+'</span>'+
          '<span class="grow">danni'+(bonusIra?' · ira inclusa':'')+'</span>'+
          '<span class="pill">'+esc(e)+'</span></div>';
        if(S.sess){ S.sess.log.unshift({t:nowISO(),txt:arma.nome+': '+r.total+' danni'}); saveSess() }
      };
      $('#dmg',el).onclick=function(){ tiraDanni(false) };
      $('#dmgc',el).onclick=function(){ tiraDanni(true) };
    }
    $$('[data-sdice]',el).forEach(function(b){ b.onclick=function(ev){
      ev.stopPropagation();
      var r=rollDice(b.dataset.sdice);
      b.outerHTML='<span class="pill">'+b.dataset.sdice+' → '+r.total+'</span>';
      if(S.sess){ S.sess.log.unshift({t:nowISO(),txt:b.dataset.sdice+': '+r.total}); saveSess() }
    }});
  });
}

</script>
<script>
"use strict";
/* ====================================================== lettore dei manuali */
openManual=function(id){
  var man=null; S.manuals.forEach(function(m){ if(m.id===id) man=m });
  if(!man) return;
  var m=modal('<h2 style="font-size:19px">'+esc(man.name)+'</h2>'+
    '<p class="faint" style="margin:9px 0"><span class="busy"></span> Apro il manuale…</p>');
  loadPdfJs().then(function(){ return DB.readBlob(P.pdf(id)) }).then(function(b){
    if(!b) throw new Error('PDF non trovato nella cartella.');
    return b.arrayBuffer();
  }).then(function(buf){
    return window.pdfjsLib.getDocument({data:buf}).promise;
  }).then(function(pdf){
    m.close();
    RD.pdf=pdf; RD.man=man; RD.cache={}; RD.pg=man.lastPage||1;
    if(RD.pg%2===0) RD.pg--;
    lettore();
  }).catch(function(e){
    m.close();
    modal('<h2 style="font-size:19px">Non si apre</h2>'+
      '<p class="faint" style="margin:9px 0 14px">'+esc(e.message)+'</p>'+
      '<button class="btn" style="width:100%" data-close>Chiudi</button>');
  });
};
function lettore(){
  var man=RD.man;
  var el=document.createElement('div');
  el.className='lettore';
  el.innerHTML=
   '<div class="ltop"><button class="lb metal" id="lx" aria-label="Chiudi"><span>✕</span></button>'+
   '<div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
   esc(man.name)+'</b><span class="faint" style="font-size:12px" id="llab"></span></div>'+
   '<button class="lmode" data-sf="ricciolo" aria-pressed="'+(S.cfg.sfoglio==='ricciolo')+'">Ricciolo</button>'+
   '<button class="lmode" data-sf="semplice" aria-pressed="'+(S.cfg.sfoglio==='semplice')+'">Semplice</button></div>'+
   '<div class="lstage"><div class="lbook" id="lbk"><canvas id="lcv"></canvas></div>'+
   '<div class="leggio">'+leggioSVG()+'</div></div>'+
   '<div class="lbar"><button class="lb metal" id="lp"><span>‹</span></button>'+
   '<input type="range" id="lr" min="1" max="'+Math.max(1,RD.pdf.numPages-1)+'" step="2" value="'+RD.pg+'">'+
   '<button class="lb metal" id="ln"><span>›</span></button></div>';
  $('#layers').appendChild(el);
  var bk=$('#lbk',el), cv=$('#lcv',el);
  RD.cv=cv; RD.ctx=cv.getContext('2d',{alpha:false}); RD.el=el; RD.hi=2;
  function label(){ var l=$('#llab',el);
    if(l) l.textContent='pagine '+RD.pg+'–'+(RD.pg+1)+' di '+RD.pdf.numPages }
  RD.label=label;
  function size(){
    var r=bk.getBoundingClientRect();
    RD.W=Math.round(r.width); RD.H=Math.round(r.height); RD.PW=RD.W/2;
    RD.dpr=Math.min(window.devicePixelRatio||1,RD.hi);
    cv.width=Math.round(RD.W*RD.dpr); cv.height=Math.round(RD.H*RD.dpr);
    RD.ctx.setTransform(RD.dpr,0,0,RD.dpr,0,0);
    RD.cache={}; paint(1); label();
  }
  RD.size=size;
  setTimeout(size,50);
  window.addEventListener('resize',size);
  $('#ln',el).onclick=function(){ turnPage(1) };
  $('#lp',el).onclick=function(){ turnPage(-1) };
  $('#lr',el).oninput=function(){
    if(RD.busy){ this.value=RD.pg; return }
    var v=parseInt(this.value,10); if(v%2===0) v--; RD.pg=Math.max(1,v); paint(1); label();
  };
  $$('[data-sf]',el).forEach(function(b){ b.onclick=function(){
    S.cfg.sfoglio=b.dataset.sf; saveCfgSoon();
    $$('[data-sf]',el).forEach(function(o){ o.setAttribute('aria-pressed',o===b) });
    paint(1);
  }});
  $('#lx',el).onclick=function(){
    window.removeEventListener('resize',size);
    RD.man.lastPage=RD.pg; DB.writeJSON(P.manual(RD.man.id),RD.man);
    RD.pdf=null; el.remove();
  };
  /* gesto con throttling a frame */
  var drag=null, want=null, ticking=false;
  function frame(){
    ticking=false;
    if(want!=null){ paint(want); want=null }
  }
  bk.addEventListener('pointerdown',function(e){
    if(RD.busy) return;
    var r=bk.getBoundingClientRect(), x=e.clientX-r.left;
    if(x<RD.W*0.5) return;
    drag={}; RD.hi=1.35; bk.setPointerCapture(e.pointerId);
  });
  bk.addEventListener('pointermove',function(e){
    if(!drag) return;
    var r=bk.getBoundingClientRect();
    drag.t=clamp((e.clientX-r.left-RD.PW)/RD.PW,0,1);
    want=drag.t;
    if(!ticking){ ticking=true; requestAnimationFrame(frame) }
  });
  bk.addEventListener('pointerup',function(){
    if(!drag) return;
    var t=drag.t==null?1:drag.t; drag=null; RD.hi=2;
    settle(t,t<0.5);
  });
  bk.addEventListener('pointercancel',function(){ if(drag){ var t=drag.t||1; drag=null; RD.hi=2; settle(t,false) } });
}
function leggioSVG(){
  return '<svg viewBox="0 0 600 34" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="M0 4 L600 4 L560 16 L40 16 Z" fill="url(#mg)" opacity=".9"/>'+
    '<rect x="40" y="16" width="520" height="3" fill="url(#mg)" opacity=".55"/>'+
    '<path d="M280 19 L320 19 L316 30 L284 30 Z" fill="url(#mg)" opacity=".7"/>'+
    '<rect x="220" y="30" width="160" height="4" rx="2" fill="url(#mg)" opacity=".85"/>'+
    '</svg>';
}
/* --------------------------------- disegno più leggero e senza scatti --- */
paint=function(t){
  if(!RD.ctx||!RD.pdf) return;
  RD.lastT=t;
  var ctx=RD.ctx, W=RD.W, H=RD.H, PW=RD.PW;
  ctx.fillStyle='#0E0D0B'; ctx.fillRect(0,0,W,H);
  var L=pageCanvas(RD.pg), Rr=pageCanvas(t<1?RD.pg+3:RD.pg+1);
  if(L) ctx.drawImage(L,0,0,PW,H);
  if(Rr) ctx.drawImage(Rr,PW,0,PW,H);
  if(t>=1) return;
  var front=pageCanvas(RD.pg+1), back=pageCanvas(RD.pg+2)||front;
  if(!front) return;
  if(S.cfg.sfoglio==='semplice'){
    var w=PW*Math.abs(t*2-1), src=t>0.5?front:back, x=t>0.5?PW:PW-w;
    if(w>1){ ctx.drawImage(src,x,0,w,H);
      ctx.fillStyle='rgba(20,15,8,'+(0.22*(1-Math.abs(t*2-1))).toFixed(3)+')'; ctx.fillRect(x,0,w,H) }
    return;
  }
  var foldX=PW+PW*t, R=Math.max(10,Math.min(PW*0.42,78)*(0.3+0.7*t));
  var step=3, sdpr=RD.dpr;
  for(var u=0;u<=PW;u+=step){
    var th=u/R, x, src2, sxs, shade;
    if(th<=Math.PI){
      x=foldX+R*Math.sin(th);
      if(th<=Math.PI/2){ src2=front; sxs=PW-u; shade=0.32*(1-Math.cos(th)) }
      else { src2=back; sxs=u; shade=0.18+0.20*(1+Math.cos(th)) }
    }else{
      x=foldX-(u-Math.PI*R); src2=back; sxs=u; shade=0.15;
    }
    if(x<-4||x>W+4) continue;
    var wd=Math.abs(Math.cos(th))*step+1.2;
    ctx.drawImage(src2,Math.round(sxs*sdpr),0,Math.max(1,Math.round(step*sdpr)),src2.height,x,0,wd,H);
    if(shade>0.01){ ctx.fillStyle='rgba(46,34,18,'+Math.min(.55,shade).toFixed(3)+')'; ctx.fillRect(x,0,wd,H) }
  }
};
pageCanvas=function(n){
  if(!RD.pdf||n<1||n>RD.pdf.numPages) return null;
  var key=n+'@'+Math.round(RD.PW)+'x'+RD.dpr;
  if(RD.cache[key]) return RD.cache[key];
  var c=document.createElement('canvas');
  c.width=Math.max(2,Math.round(RD.PW*RD.dpr)); c.height=Math.max(2,Math.round(RD.H*RD.dpr));
  var x=c.getContext('2d'); x.fillStyle='#EDE4D3'; x.fillRect(0,0,c.width,c.height);
  RD.cache[key]=c;
  RD.pdf.getPage(n).then(function(p){
    var vp=p.getViewport({scale:1});
    var sc=Math.min(c.width/vp.width,c.height/vp.height);
    var v2=p.getViewport({scale:sc});
    x.save(); x.translate((c.width-v2.width)/2,(c.height-v2.height)/2);
    return p.render({canvasContext:x,viewport:v2}).promise.then(function(){
      x.restore();
      if(RD.ctx) paint(RD.lastT==null?1:RD.lastT);
      /* pagine vicine pronte in anticipo */
      [n+2,n+3,n-2,n-1].forEach(function(k){
        if(k>=1&&RD.pdf&&k<=RD.pdf.numPages) setTimeout(function(){ pageCanvas(k) },40);
      });
    });
  }).catch(function(){});
  return c;
};

</script>
